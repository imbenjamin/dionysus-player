name: Build and test
description: >-
  Builds the app and runs one test plan on a simulator of an exact device type
  and iOS version, installing that iOS runtime first if the runner lacks it.
  Shared by pr-checks.yml, release.yml and ui-tests.yml.

inputs:
  scheme:
    description: Scheme to build and test.
    required: false
    default: DionysusPlayer
  project:
    description: Xcode project to build (generated by setup-ios-project).
    required: false
    default: DionysusPlayer.xcodeproj
  result-bundle-path:
    description: >-
      Where to write the .xcresult bundle. The caller uploads this as an
      artifact on failure — it's the only way to see *which* test failed
      without re-running locally.
    required: false
    default: .build/TestResults.xcresult
  test-plan:
    description: >-
      Which test plan to run (see TestPlans/). Defaults to UnitTests, the
      scheme's own default, so adding the UI test target to the scheme can't
      silently lengthen an existing caller's run — a UI plan has to be asked
      for by name.
    required: false
    default: UnitTests
  device-type:
    description: >-
      Simulator device type, by name as `xcrun simctl list devicetypes` prints
      it. It must support every iOS version it's paired with — iPhone 17
      can't run iOS 18, which is why the default is an iPhone 16.
    required: false
    default: iPhone 16
  ios-version:
    description: >-
      iOS runtime version, e.g. "26.5". Installed with `xcodebuild
      -downloadPlatform` if the runner image doesn't carry it.
    required: false
    default: "26.5"
  retry-tests-on-failure:
    description: >-
      Pass `-retry-tests-on-failure` on top of the plan's own repetition
      settings, so a test that fails once and then passes is reported as
      flaky rather than as a break.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install iOS ${{ inputs.ios-version }} runtime if missing
      shell: bash
      env:
        IOS_VERSION: ${{ inputs.ios-version }}
      run: |
        # Each runner image carries only the runtimes of the Xcode versions
        # installed on it — macos-26 has iOS 26.x and nothing older. The iOS
        # 18 floor (project.yml's deployment target) has to be downloaded,
        # which takes minutes, so only do it when it's actually missing.
        # arm64-only: the runner is Apple silicon, and the universal variant
        # is roughly twice the size.
        has_runtime() {
          xcrun simctl list runtimes available -j \
            | jq -e --arg v "$IOS_VERSION" '.runtimes[] | select(.platform == "iOS" and .version == $v)' >/dev/null
        }
        if has_runtime; then
          echo "iOS $IOS_VERSION runtime already installed."
          exit 0
        fi
        echo "::group::Downloading iOS $IOS_VERSION runtime"
        start=$SECONDS
        xcodebuild -downloadPlatform iOS -buildVersion "$IOS_VERSION" -architectureVariant arm64
        echo "::endgroup::"
        echo "Downloaded and installed in $((SECONDS - start))s."
        if ! has_runtime; then
          echo "::error::iOS $IOS_VERSION runtime still missing after download." >&2
          xcrun simctl list runtimes
          exit 1
        fi

    - name: Create simulator
      id: select_simulator
      shell: bash
      env:
        DEVICE_TYPE: ${{ inputs.device-type }}
        IOS_VERSION: ${{ inputs.ios-version }}
      run: |
        # A fresh device of exactly the requested type and runtime, rather
        # than picking one of the image's pre-made devices. Picking used to
        # mean "the newest iPhone on the newest runtime", which moved whenever
        # the image changed, and naming a device without its runtime once
        # resolved to a pairing that didn't exist (2026-08-13: "iPhone 16e"
        # was only provisioned for an older runtime). Creating it makes the
        # pairing explicit, and fails loudly here if it's impossible.
        runtime=$(xcrun simctl list runtimes available -j \
          | jq -r --arg v "$IOS_VERSION" '.runtimes[] | select(.platform == "iOS" and .version == $v) | .identifier' \
          | head -1)
        if [ -z "$runtime" ]; then
          echo "::error::No available iOS $IOS_VERSION runtime." >&2
          xcrun simctl list runtimes
          exit 1
        fi
        if ! udid=$(xcrun simctl create "CI $DEVICE_TYPE" "$DEVICE_TYPE" "$runtime"); then
          echo "::error::Couldn't create a '$DEVICE_TYPE' simulator on $runtime — is the device type supported by that runtime?" >&2
          xcrun simctl list devicetypes
          exit 1
        fi
        echo "Created '$DEVICE_TYPE' on $runtime: $udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build
      # `shell: bash` runs with `-eo pipefail`, so xcodebuild's exit status
      # survives the pipe into xcbeautify. Don't switch to `shell: sh` or an
      # explicit interpreter without re-adding pipefail — without it a failing
      # build reports success, because the pipeline's status becomes
      # xcbeautify's.
      shell: bash
      run: |
        xcodebuild build-for-testing \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=iOS Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          | xcbeautify --renderer github-actions

    - name: Test
      shell: bash
      run: |
        retry=()
        if [ "${{ inputs.retry-tests-on-failure }}" = "true" ]; then
          retry=(-retry-tests-on-failure)
        fi
        xcodebuild test-without-building \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=iOS Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          "${retry[@]}" \
          -resultBundlePath "${{ inputs.result-bundle-path }}" \
          | xcbeautify --renderer github-actions
