name: Build and test
description: >-
  Builds the app and runs one test plan on an iPhone simulator that actually
  exists on this runner. Shared by pr-checks.yml, release.yml and
  nightly-ui-tests.yml.

inputs:
  scheme:
    description: Scheme to build and test.
    required: false
    default: DionysusPlayer
  project:
    description: Xcode project to build (generated by setup-ios-project).
    required: false
    default: DionysusPlayer.xcodeproj
  result-bundle-path:
    description: >-
      Where to write the .xcresult bundle. The caller uploads this as an
      artifact on failure — it's the only way to see *which* test failed
      without re-running locally.
    required: false
    default: .build/TestResults.xcresult
  test-plan:
    description: >-
      Which test plan to run (see TestPlans/). Defaults to UnitTests, the
      scheme's own default, so adding the UI test target to the scheme can't
      silently lengthen an existing caller's run — a UI plan has to be asked
      for by name.
    required: false
    default: UnitTests

runs:
  using: composite
  steps:
    - name: Select simulator
      id: select_simulator
      shell: bash
      run: |
        # `xcrun xctrace list devices` (the usual boilerplate here) lists
        # a bare device name with no guarantee it's paired with the
        # runner's "latest" iOS runtime — `-destination
        # platform=...,name=X` with no OS resolves to "OS:latest", which
        # then fails to match if X isn't provisioned for that runtime
        # (confirmed failure: 2026-08-13, picked "iPhone 16e", which only
        # had an older runtime installed on the runner). Selecting a UDID
        # directly from `simctl`'s own available-devices listing instead
        # guarantees a name+runtime pairing that actually exists.
        UDID=$(xcrun simctl list devices available -j \
          | jq -r '[.devices | to_entries[] | .key as $rt | .value[] | select(.name | test("^iPhone")) | {runtime: $rt, udid: .udid, name: .name}] | sort_by(.runtime) | last')
        echo "$UDID" | jq .
        udid=$(echo "$UDID" | jq -r '.udid')
        if [ -z "$udid" ] || [ "$udid" = "null" ]; then
          echo "error: no available iPhone simulator found" >&2
          xcrun simctl list devices available
          exit 1
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build
      # `shell: bash` runs with `-eo pipefail`, so xcodebuild's exit status
      # survives the pipe into xcbeautify. Don't switch to `shell: sh` or an
      # explicit interpreter without re-adding pipefail — without it a failing
      # build reports success, because the pipeline's status becomes
      # xcbeautify's.
      shell: bash
      run: |
        xcodebuild build-for-testing \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=iOS Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          | xcbeautify --renderer github-actions

    - name: Test
      shell: bash
      run: |
        xcodebuild test-without-building \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=iOS Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          -resultBundlePath "${{ inputs.result-bundle-path }}" \
          | xcbeautify --renderer github-actions
