name: Build and test
description: >-
  Builds the app and runs one test plan on a simulator of an exact device type
  and OS version, iOS or tvOS. Shared by pr-checks.yml, release.yml,
  ui-tests.yml and tv-ui-tests.yml.

inputs:
  scheme:
    description: Scheme to build and test.
    required: false
    default: DionysusPlayer
  project:
    description: Xcode project to build (generated by setup-ios-project).
    required: false
    default: DionysusPlayer.xcodeproj
  result-bundle-path:
    description: >-
      Where to write the .xcresult bundle. The caller uploads this as an
      artifact on failure — it's the only way to see *which* test failed
      without re-running locally. If the test runner crashes before running a
      test and the plan is run again (see the "Test" step), the second run
      writes `<name>-attempt-2.xcresult` beside it, which the caller uploads
      too.
    required: false
    default: .build/TestResults.xcresult
  test-plan:
    description: >-
      Which test plan to run (see TestPlans/). Defaults to UnitTests, the
      scheme's own default, so adding the UI test target to the scheme can't
      silently lengthen an existing caller's run — a UI plan has to be asked
      for by name.
    required: false
    default: UnitTests
  platform:
    description: >-
      Simulator platform, "iOS" or "tvOS" — the runtime's platform as
      `xcrun simctl list runtimes -j` reports it, and the destination's.
    required: false
    default: iOS
  device-type:
    description: >-
      Simulator device type, by name as `xcrun simctl list devicetypes` prints
      it. It must support every iOS version it's paired with — iPhone 17
      can't run iOS 18, which is why the default is an iPhone 16.
    required: false
    default: iPhone 16
  ios-version:
    description: >-
      Runtime version of `platform`, e.g. "27.0". The runner must already
      carry it: there's no download fallback here, because Xcode won't
      download an iOS 18 runtime at all. ui-tests.yml installs the floor's
      from the Actions cache before calling this.
    required: false
    default: "27.0"
  retry-tests-on-failure:
    description: >-
      Pass `-retry-tests-on-failure` on top of the plan's own repetition
      settings, so a test that fails once and then passes is reported as
      flaky rather than as a break.
    required: false
    default: "false"
  run-tests-until-failure:
    description: >-
      Pass `-run-tests-until-failure`: run the plan again and again until a
      test fails, at most `test-iterations` times (xcodebuild's default is
      100). For the nightly flake hunt. Can't be combined with
      `retry-tests-on-failure`.
    required: false
    default: "false"
  test-iterations:
    description: >-
      With `retry-tests-on-failure`, how many attempts a failing test gets in
      all (`-test-iterations`). Empty keeps xcodebuild's default, 3. A test
      that passes is never run again, so this costs nothing on a green run.
      With `run-tests-until-failure`, the most times the plan runs.
    required: false
    default: ""
  only-testing:
    description: >-
      Space-separated test identifiers (`Target/Class` or
      `Target/Class/test_name`) to run instead of the whole plan, each passed
      as `-only-testing`. Empty runs the plan. tv-ui-tests.yml uses it to
      split a plan across parallel jobs.
    required: false
    default: ""

  warm-up-test:
    description: >-
      A UI test (`Target/Class/test_name`) run once between the build and the
      plan, its result ignored. Empty runs none. On CI the first UI test of a
      job could read an accessibility tree seconds behind the app (see
      TESTING.md, "The first test's warm-up").
    required: false
    default: ""

  duo-pose:
    description: >-
      The iPhone Duo's pose ("closed", "open", "book" or "tabletop") when the
      caller has set one, so a rerun after rebooting the Simulator (see the
      "Test" step) can set it again with Scripts/duo-pose/set-duo-pose.sh.
      Empty for any other device.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select simulator
      id: select_simulator
      shell: bash
      env:
        DEVICE_TYPE: ${{ inputs.device-type }}
        IOS_VERSION: ${{ inputs.ios-version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        # Exactly the requested device type on exactly the requested runtime.
        # This used to mean "the newest iPhone on the newest runtime", which
        # moved whenever the image changed, and naming a device without its
        # runtime once resolved to a pairing that didn't exist (2026-08-13:
        # "iPhone 16e" was only provisioned for an older runtime).
        #
        # The image's own device is preferred when it has one — it's what the
        # suite ran on before this action created devices — and a new one is
        # created only when it doesn't (e.g. iPhone 16 on iOS 27.0). Either
        # behaves the same as far as measured: PR #258 briefly blamed three
        # iPad audit failures on freshly created devices, but they failed on
        # the image's own iPad too, and turned out to have failed every night
        # for weeks behind a missing `pipefail` (see TESTING.md).
        #
        # Matched on the runtime's version string exactly: macos-15 carries
        # both 18.5 and 18.6, and a prefix match would pick either.
        runtime=$(xcrun simctl list runtimes available -j \
          | jq -r --arg v "$IOS_VERSION" --arg p "$PLATFORM" '.runtimes[] | select(.platform == $p and .version == $v) | .identifier' \
          | head -1)
        if [ -z "$runtime" ]; then
          echo "::error::No $PLATFORM $IOS_VERSION runtime on this runner image. It can't be downloaded; run this environment on an image that carries it (see ui-tests.yml)." >&2
          xcrun simctl list runtimes
          exit 1
        fi
        udid=$(xcrun simctl list devices available -j \
          | jq -r --arg rt "$runtime" --arg name "$DEVICE_TYPE" '.devices[$rt] // [] | map(select(.name == $name)) | first | .udid // empty')
        if [ -n "$udid" ]; then
          echo "Using the image's '$DEVICE_TYPE' on $runtime: $udid"
        elif udid=$(xcrun simctl create "$DEVICE_TYPE" "$DEVICE_TYPE" "$runtime"); then
          echo "Created '$DEVICE_TYPE' on $runtime (the image has none): $udid"
        else
          echo "::error::Couldn't create a '$DEVICE_TYPE' simulator on $runtime — is the device type supported by that runtime?" >&2
          xcrun simctl list devicetypes
          exit 1
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build
      # `shell: bash` runs with `-eo pipefail`, so xcodebuild's exit status
      # survives the pipe into xcbeautify. Don't switch to `shell: sh` or an
      # explicit interpreter without re-adding pipefail — without it a failing
      # build reports success, because the pipeline's status becomes
      # xcbeautify's.
      shell: bash
      run: |
        xcodebuild build-for-testing \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=${{ inputs.platform }} Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          | xcbeautify --renderer github-actions

    - name: Wait for the simulator
      shell: bash
      env:
        UDID: ${{ steps.select_simulator.outputs.udid }}
        DEVICE_TYPE: ${{ inputs.device-type }}
        IOS_VERSION: ${{ inputs.ios-version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        # Boots the device after the build (unless the Duo job already has)
        # and blocks until it is ready, so the test runner launches against a
        # booted Simulator; booting during the build slowed the build up to
        # six-fold (TESTING.md, "Where they run in CI").
        # Composite steps can't use `timeout-minutes`, and macOS has no
        # `timeout`, so the 15-minute bound is a poll on bootstatus. Its
        # output is kept, and its tail printed if it fails or runs out.
        limit=900
        start=$SECONDS
        out=$(mktemp "${RUNNER_TEMP:-/tmp}/bootstatus.XXXXXX")
        xcrun simctl bootstatus "$UDID" -b > "$out" 2>&1 &
        pid=$!
        while kill -0 "$pid" 2>/dev/null; do
          if [ $((SECONDS - start)) -ge "$limit" ]; then
            kill "$pid" 2>/dev/null || true
            echo "::error::The '$DEVICE_TYPE' simulator ($PLATFORM $IOS_VERSION, $UDID) wasn't ready after $((SECONDS - start)) s." >&2
            tail -n 20 "$out"
            exit 1
          fi
          sleep 2
        done
        if ! wait "$pid"; then
          echo "::error::'simctl bootstatus' failed for the '$DEVICE_TYPE' simulator ($PLATFORM $IOS_VERSION, $UDID) after $((SECONDS - start)) s." >&2
          tail -n 20 "$out"
          exit 1
        fi
        echo "The simulator was ready after $((SECONDS - start)) s of waiting"
        # For "Summarize results".
        echo "SIMULATOR_WAIT_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

    - name: Warm up
      if: inputs.warm-up-test != ''
      shell: bash
      run: |
        # Its result doesn't count: the plan runs this test again. No result
        # bundle, so the uploaded one holds only the plan's run, and no
        # diagnostics, which a failure would wait up to 10 minutes for.
        if xcodebuild test-without-building \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=${{ inputs.platform }} Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          -only-testing:"${{ inputs.warm-up-test }}" \
          -collect-test-diagnostics never \
          | xcbeautify --renderer github-actions; then
          echo "Warm-up test passed"
        else
          echo "::notice::The warm-up test failed; its result doesn't count."
        fi

    - name: Test
      # Scripts/ci/run-test-plan.sh runs the plan, and runs it once more on a
      # rebooted Simulator if the test runner crashed before running a test
      # (TESTING.md, "Where they run in CI"); Scripts/ci/ holds its tests.
      # It sets pipefail itself, for the pipe into xcbeautify.
      shell: bash
      env:
        # Via env, not `${{ }}` in a script: read as values, never pasted
        # into script text.
        SCHEME: ${{ inputs.scheme }}
        PROJECT: ${{ inputs.project }}
        TEST_PLAN: ${{ inputs.test-plan }}
        PLATFORM: ${{ inputs.platform }}
        UDID: ${{ steps.select_simulator.outputs.udid }}
        RESULT_BUNDLE_PATH: ${{ inputs.result-bundle-path }}
        RETRY_TESTS_ON_FAILURE: ${{ inputs.retry-tests-on-failure }}
        RUN_TESTS_UNTIL_FAILURE: ${{ inputs.run-tests-until-failure }}
        TEST_ITERATIONS: ${{ inputs.test-iterations }}
        ONLY_TESTING: ${{ inputs.only-testing }}
        DUO_POSE: ${{ inputs.duo-pose }}
      run: Scripts/ci/run-test-plan.sh

    - name: Summarize results
      # Lists the tests that failed and the ones that passed only on a retry
      # on the job's summary, with a ::warning per flaky test, so a retry never
      # hides a flake. Never fails the job: every problem becomes a warning.
      # Bundles: attempt 1's, and attempt 2's if "Test" ran the plan again
      # after an infrastructure failure; attempt 2 is then the result.
      if: always()
      shell: bash
      env:
        RESULT_BUNDLE_PATH: ${{ inputs.result-bundle-path }}
        TEST_PLAN: ${{ inputs.test-plan }}
      run: |
        # No `set -e`: nothing here may fail the step.
        summary=${GITHUB_STEP_SUMMARY:-/dev/stdout}
        here="$GITHUB_ACTION_PATH/../../../Scripts/ci"
        bundle=$RESULT_BUNDLE_PATH
        attempt2="${RESULT_BUNDLE_PATH%.xcresult}-attempt-2.xcresult"
        [ -d "$attempt2" ] && bundle=$attempt2
        {
          echo "### Test results: $TEST_PLAN"
          echo
          if [ ! -d "$bundle" ]; then
            echo "No result bundle was written; the job failed before testing started."
            exit 0
          fi
          if [ -f .build/test-rerun.txt ]; then
            if [ -d "$attempt2" ]; then
              echo "**The plan ran twice.** The test runner failed before running a test (\`$(cat .build/test-rerun.txt)\`), so the Simulator was rebooted and the plan run again. Below is the second run."
            else
              echo "**The plan ran twice.** The test runner failed before running a test (\`$(cat .build/test-rerun.txt)\`), so the Simulator was rebooted and the plan run again, but the rerun wrote no result bundle. Below is the first attempt's."
            fi
            echo
          fi
          # xcodebuild's "Testing started completed" figure is printed when
          # testing finishes: the whole test run's duration, not the time to
          # the first test.
          for n in 1 2; do
            log=.build/test-attempt-$n.log
            [ -f "$log" ] || continue
            seconds=$(grep -o 'IDETestOperationsObserverDebug: [0-9.]* elapsed -- Testing started completed' "$log" | head -1 | awk '{print $2}')
            echo "- Attempt $n: xcodebuild testing took ${seconds:-unknown} s (launch to finish)"
          done
          [ -n "$SIMULATOR_WAIT_SECONDS" ] && echo "- Waited ${SIMULATOR_WAIT_SECONDS} s for the Simulator after the build"
          echo
        } >> "$summary"
        json=$(mktemp "${RUNNER_TEMP:-/tmp}/test-results.XXXXXX")
        if xcrun xcresulttool get test-results tests --path "$bundle" > "$json"; then
          python3 "$here/xcresult_summary.py" "$json" >> "$summary" || true
        else
          echo "::warning::Couldn't read $bundle with xcresulttool, so the test summary is missing."
        fi
        exit 0
