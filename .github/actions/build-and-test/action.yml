name: Build and test
description: >-
  Builds the app and runs one test plan on a simulator of an exact device type
  and OS version, iOS or tvOS. Shared by pr-checks.yml, release.yml,
  ui-tests.yml and tv-ui-tests.yml.

inputs:
  scheme:
    description: Scheme to build and test.
    required: false
    default: DionysusPlayer
  project:
    description: Xcode project to build (generated by setup-ios-project).
    required: false
    default: DionysusPlayer.xcodeproj
  result-bundle-path:
    description: >-
      Where to write the .xcresult bundle. The caller uploads this as an
      artifact on failure — it's the only way to see *which* test failed
      without re-running locally.
    required: false
    default: .build/TestResults.xcresult
  test-plan:
    description: >-
      Which test plan to run (see TestPlans/). Defaults to UnitTests, the
      scheme's own default, so adding the UI test target to the scheme can't
      silently lengthen an existing caller's run — a UI plan has to be asked
      for by name.
    required: false
    default: UnitTests
  platform:
    description: >-
      Simulator platform, "iOS" or "tvOS" — the runtime's platform as
      `xcrun simctl list runtimes -j` reports it, and the destination's.
    required: false
    default: iOS
  device-type:
    description: >-
      Simulator device type, by name as `xcrun simctl list devicetypes` prints
      it. It must support every iOS version it's paired with — iPhone 17
      can't run iOS 18, which is why the default is an iPhone 16.
    required: false
    default: iPhone 16
  ios-version:
    description: >-
      Runtime version of `platform`, e.g. "27.0". The runner must already
      carry it: there's no download fallback here, because Xcode won't
      download an iOS 18 runtime at all. ui-tests.yml installs the floor's
      from the Actions cache before calling this.
    required: false
    default: "27.0"
  retry-tests-on-failure:
    description: >-
      Pass `-retry-tests-on-failure` on top of the plan's own repetition
      settings, so a test that fails once and then passes is reported as
      flaky rather than as a break.
    required: false
    default: "false"
  test-iterations:
    description: >-
      With `retry-tests-on-failure`, how many attempts a failing test gets in
      all (`-test-iterations`). Empty keeps xcodebuild's default, 3. A test
      that passes is never run again, so this costs nothing on a green run.
    required: false
    default: ""
  only-testing:
    description: >-
      Space-separated test identifiers (`Target/Class` or
      `Target/Class/test_name`) to run instead of the whole plan, each passed
      as `-only-testing`. Empty runs the plan. tv-ui-tests.yml uses it to
      split a plan across parallel jobs.
    required: false
    default: ""

  warm-up-test:
    description: >-
      A UI test (`Target/Class/test_name`) run once between the build and the
      plan, its result ignored. Empty runs none. On CI the first UI test of a
      job could read an accessibility tree seconds behind the app (see
      TESTING.md, "The first test's warm-up").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select simulator
      id: select_simulator
      shell: bash
      env:
        DEVICE_TYPE: ${{ inputs.device-type }}
        IOS_VERSION: ${{ inputs.ios-version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        # Exactly the requested device type on exactly the requested runtime.
        # This used to mean "the newest iPhone on the newest runtime", which
        # moved whenever the image changed, and naming a device without its
        # runtime once resolved to a pairing that didn't exist (2026-08-13:
        # "iPhone 16e" was only provisioned for an older runtime).
        #
        # The image's own device is preferred when it has one — it's what the
        # suite ran on before this action created devices — and a new one is
        # created only when it doesn't (e.g. iPhone 16 on iOS 27.0). Either
        # behaves the same as far as measured: PR #258 briefly blamed three
        # iPad audit failures on freshly created devices, but they failed on
        # the image's own iPad too, and turned out to have failed every night
        # for weeks behind a missing `pipefail` (see TESTING.md).
        #
        # Matched on the runtime's version string exactly: macos-15 carries
        # both 18.5 and 18.6, and a prefix match would pick either.
        runtime=$(xcrun simctl list runtimes available -j \
          | jq -r --arg v "$IOS_VERSION" --arg p "$PLATFORM" '.runtimes[] | select(.platform == $p and .version == $v) | .identifier' \
          | head -1)
        if [ -z "$runtime" ]; then
          echo "::error::No $PLATFORM $IOS_VERSION runtime on this runner image. It can't be downloaded; run this environment on an image that carries it (see ui-tests.yml)." >&2
          xcrun simctl list runtimes
          exit 1
        fi
        udid=$(xcrun simctl list devices available -j \
          | jq -r --arg rt "$runtime" --arg name "$DEVICE_TYPE" '.devices[$rt] // [] | map(select(.name == $name)) | first | .udid // empty')
        if [ -n "$udid" ]; then
          echo "Using the image's '$DEVICE_TYPE' on $runtime: $udid"
        elif udid=$(xcrun simctl create "$DEVICE_TYPE" "$DEVICE_TYPE" "$runtime"); then
          echo "Created '$DEVICE_TYPE' on $runtime (the image has none): $udid"
        else
          echo "::error::Couldn't create a '$DEVICE_TYPE' simulator on $runtime — is the device type supported by that runtime?" >&2
          xcrun simctl list devicetypes
          exit 1
        fi
        echo "udid=$udid" >> "$GITHUB_OUTPUT"

    - name: Build
      # `shell: bash` runs with `-eo pipefail`, so xcodebuild's exit status
      # survives the pipe into xcbeautify. Don't switch to `shell: sh` or an
      # explicit interpreter without re-adding pipefail — without it a failing
      # build reports success, because the pipeline's status becomes
      # xcbeautify's.
      shell: bash
      run: |
        xcodebuild build-for-testing \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=${{ inputs.platform }} Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          | xcbeautify --renderer github-actions

    - name: Warm up
      if: inputs.warm-up-test != ''
      shell: bash
      run: |
        # Its result doesn't count: the plan runs this test again. No result
        # bundle, so the uploaded one holds only the plan's run.
        if xcodebuild test-without-building \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=${{ inputs.platform }} Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          -only-testing:"${{ inputs.warm-up-test }}" \
          | xcbeautify --renderer github-actions; then
          echo "Warm-up test passed"
        else
          echo "::notice::The warm-up test failed; its result doesn't count."
        fi

    - name: Test
      shell: bash
      env:
        # Via env, not `${{ }}` in the script: they're word-split into
        # arguments below, never pasted into the script text.
        ONLY_TESTING: ${{ inputs.only-testing }}
        TEST_ITERATIONS: ${{ inputs.test-iterations }}
      run: |
        retry=()
        if [ "${{ inputs.retry-tests-on-failure }}" = "true" ]; then
          retry=(-retry-tests-on-failure)
          if [ -n "$TEST_ITERATIONS" ]; then
            retry+=(-test-iterations "$TEST_ITERATIONS")
          fi
        fi
        only=()
        for test in $ONLY_TESTING; do
          only+=("-only-testing:$test")
        done
        xcodebuild test-without-building \
          -scheme "${{ inputs.scheme }}" \
          -project "${{ inputs.project }}" \
          -testPlan "${{ inputs.test-plan }}" \
          -destination "platform=${{ inputs.platform }} Simulator,id=${{ steps.select_simulator.outputs.udid }}" \
          "${retry[@]}" \
          "${only[@]}" \
          -resultBundlePath "${{ inputs.result-bundle-path }}" \
          | xcbeautify --renderer github-actions
