name: PR checks

on:
  # No `push:` trigger: both `stable` and `develop` are covered by rulesets
  # that (a) block any push that isn't a PR merge and (b) set
  # `strict_required_status_checks_policy: true` on this workflow's check
  # — together that guarantees every merge commit's tree is identical to
  # what `pull_request` already tested, so a push-triggered re-run would
  # always be re-testing identical code. If either of those ruleset
  # settings ever changes (bypass actors added, strict policy turned off),
  # this reasoning no longer holds and a `push:` trigger would earn its
  # keep again.
  pull_request:
    branches: [ "stable", "develop" ]

# This job only checks out code, builds, and tests — no step needs write
# access to anything. Scoped explicitly rather than left to the repo-wide
# default (which may not always be read-only) — see release.yml's
# `permissions` comment for why write access is scoped per-workflow here.
permissions:
  contents: read

concurrency:
  # Superseded pushes to the same PR are worth cancelling; a ~7 minute run
  # per force-push otherwise queues up behind itself.
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # ⚠️ DO NOT RENAME THIS JOB. Both branch rulesets ("Secure stable",
    # "develop protection") require a status check whose context is this
    # exact string — GitHub keys required checks on the *job* name, not on
    # the workflow name or filename. Renaming it here without first updating
    # both rulesets makes every PR hang forever waiting on a check that no
    # longer reports, including the PR doing the rename. The name is
    # starter-template boilerplate and reads oddly; it stays anyway.
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Verify AetherEngine version display is up to date
        # This is the *only* place AetherEngine drift is enforced. release.yml
        # deliberately regenerates rather than verifies (a newly-published
        # upstream version must never fail an already-pushed tag), so if this
        # check goes away the checked-in constant silently rots.
        #
        # Runs on every PR rather than only at release time — a fresh
        # `AetherEngine` resolution picking up a newer release can happen on
        # any PR, and catching it here surfaces it within days of it happening
        # upstream. Also has the side effect of populating this runner's SPM
        # caches with today's real resolution, which the build below then
        # reuses rather than resolving cold itself. Confirmed live
        # (2026-08-28): a stale *local* SPM cache let a real version bump go
        # undetected on a developer machine even after this same script ran
        # there — CI is always a clean checkout, so this check is meaningful
        # every time it runs here, unlike a local run someone forgets is stale.
        run: |
          ./Scripts/update-aetherengine-version.sh
          if ! git diff --exit-code -- DionysusPlayer/Core/Playback/AetherEngineVersion.swift; then
            echo "::error::AetherEngineVersion.swift is out of date — run ./Scripts/update-aetherengine-version.sh locally and commit the result." >&2
            exit 1
          fi

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Upload test results
        # Failure only — a green run's .xcresult is ~100MB of nothing anyone
        # will open.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  ui-smoke:
    # A separate job from `build`, deliberately. That one's name is required
    # verbatim by both branch rulesets (see its own comment), so it must not
    # grow a second responsibility or change shape. This one is also a new
    # check context: it reports on every PR from the moment it merges, but it
    # does not *block* anything until it is added to the "develop protection"
    # and "Secure stable" rulesets by hand.
    #
    # Runs the smoke plan only — seven journeys, no per-feature coverage. The
    # full suite runs nightly (nightly-ui-tests.yml) and on release tags. The
    # split exists because UI tests are slow and a shared runner is variable;
    # the point of this job is fast pre-merge feedback on the paths that stop
    # the app being usable at all.
    name: UI smoke tests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      # No AetherEngine drift check here — `build` already enforces it on
      # every PR, and running it twice would just resolve packages twice.

      - name: Shut down all simulators
        # A simulator left booted by the image (or by a previous step) is the
        # single most common source of UI-test flake on a shared runner:
        # xcodebuild picks a device that is already mid-boot and times out
        # launching the app. Start from a known-clean state instead.
        run: xcrun simctl shutdown all || true

      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          test-plan: UITests-Smoke
          result-bundle-path: .build/UITestResults.xcresult

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # A failed UI test's .xcresult carries the screenshots and the
          # recorded interaction, which is the only practical way to see what
          # the runner actually saw.
          name: ui-test-results
          path: .build/UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
