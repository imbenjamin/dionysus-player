name: CodeQL

# Scans the real Swift app plus this repo's own GitHub Actions workflow
# files. The repo's default-branch code-scanning setup ("default setup")
# could only cover the `actions` language on its own — its autobuild
# couldn't build an XcodeGen-generated Xcode project (confirmed live,
# 2026-09-01: `Analyze (swift)` failed at the Autobuild step). Swift/iOS
# needs a real build under CodeQL's tracer, which default setup doesn't
# support, so this is an "advanced setup" workflow instead — build-mode
# `manual`, with the same setup-ios-project composite action pr-checks.yml
# and release.yml use, so all three can't drift apart on toolchain/project
# generation. Default setup was disabled for this repo once this workflow
# was added; the two can't coexist for the same language without GitHub
# rejecting the advanced-setup upload.
#
# Two separate jobs, not one matrix job, because their gating differs:
# `analyze-swift` only blocks a PR into `stable`, not `develop`. Its first
# live run (PR #166) took ~43 minutes — genuine CodeQL-tracer overhead on
# AetherEngine's FFmpeg/SMBClient/LibDovi dependencies, not a fluke — and
# this repo merges several `develop` PRs a day with no second reviewer to
# absorb that wait. `stable` only moves a handful of times a year via the
# develop -> stable promotion PR (see promote-to-stable.yml), so blocking
# there costs nothing in day-to-day velocity while still gating anything
# that's about to ship. `develop` still gets `swift` coverage — just
# non-blocking, via the `push`/`schedule` triggers below rather than
# `pull_request` — so a real finding shows up as a Security-tab alert
# within, worst case, a week, without holding up the PR that introduced it.
# (A single matrix job with a job-level `if:` referencing `matrix.language`
# was tried first and rejected by GitHub at parse time — "Unrecognized
# named-value: 'matrix'" — the matrix context isn't available to a job's
# own `if:`, only within its steps/runs-on/etc. Two jobs sidesteps that
# entirely.)
#
# `analyze-actions` stays cheap (~40s) regardless of target branch, so it
# blocks PRs into both.
#
# `push: develop` exists for a different reason than pr-checks.yml's lack
# of one: the tree really is identical to what `pull_request` already
# scanned (same guarantee pr-checks.yml relies on), but GitHub's Security
# tab reads code-scanning alerts from analyses tied to the default branch
# itself, not from PR-merge refs — without this, PR-time scans would never
# populate it (GitHub says so explicitly: "Please specify an on.push hook
# to analyze and see code scanning alerts from the default branch on the
# Security tab", surfaced live setting this workflow up). It's also now
# `analyze-swift`'s only per-merge trigger on `develop`, since
# `pull_request` no longer covers it there.
on:
  pull_request:
    branches: [ "stable", "develop" ]
  push:
    branches: [ "develop" ]
  schedule:
    # Weekly, matching the cadence the disabled default setup used —
    # catches newly-published CodeQL queries surfacing something in code
    # that hasn't changed, not just new PRs.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-latest
    timeout-minutes: 45
    # Skip only when this is a pull_request into develop — see header.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == 'stable'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        # A plain build, not build-for-testing/archive: CodeQL only needs
        # the compiler actually invoked under its tracer, not a runnable
        # product, so this skips simulator selection and signing entirely.
        shell: bash
        run: |
          xcodebuild build \
            -project DionysusPlayer.xcodeproj \
            -scheme DionysusPlayer \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
