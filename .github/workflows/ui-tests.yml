name: UI tests

# The UI-test device/OS matrix, in one place. Called by pr-checks.yml (smoke
# plan), nightly-ui-tests.yml and release.yml (full plan) — so the nightly run
# exercises exactly what gates a release, and a manual nightly dispatch on a
# branch is a dry run of the release's UI stage.
#
# The matrix is one iPhone and one iPad on:
#   - iOS 27.2 on the `xcode-27` image. Pinned, never "the newest": the
#     version is in the required check names. It was 27.0 until
#     2026-11-16, when image 20261112 (macOS 27.2, Xcode 27.3 beta) stopped
#     Xcode 27.1's xcodebuild seeing any iOS 27.0 Simulator (exit 70,
#     "Unable to find a device"; #473). Both that image and 20261104
#     carry 27.2 with the same iPhones and iPads, and Xcode 27.1 lists them.
#   - the deployment floor, iOS 18.6 (project.yml's target is 18.0). This is
#     the only place the pre-26 branch of every `#available(iOS 26, *)` check
#     runs.
#
# Every leg builds with Xcode 27.1 on `xcode-27`, the Xcode release.yml
# archives with and the one AetherEngine is built and tested with: 7.43.0 and
# later don't compile with Xcode 26 (2026-10-20, "sending 'codecpar' risks
# causing data races"), which is what moved iOS off `macos-26`.
#
# The floor needs an iOS 18.6 runtime, which the image doesn't carry and Xcode
# won't download (`xcodebuild -downloadPlatform iOS -buildVersion 18.6`
# answers "not available for download", exit 70, on Xcode 26.6 and 27.1
# alike). `macos-15` does carry it, so the `floor-runtime` job below copies its
# runtime image into the Actions cache (once: a later run finds it there) and
# the floor jobs install it from the cache before building. Xcode 27.1 runs
# an iOS 18.6 Simulator (checked on a Mac, 2026-10-20). Building on `macos-15`
# instead isn't possible: its newest Xcode, 26.3, can't compile AetherEngine.
#
# When CI moves to a new Xcode, update the list below together with
# setup-ios-project's default and the `runs-on` labels (pr-checks.yml,
# codeql.yml, release.yml).
#
# The device models are the same on every OS, so a failure on only one OS
# can't be a screen-size difference. iPhone 16 rather than 17 because the 17
# can't run iOS 18; iPad (A16) runs both.
#
# The iPhone Duo runs in its own job (`duo-ui-tests`), once per pose in
# `duo-poses`: closed (the outer display), open (the inner one, held wide),
# book (partly folded, held wide) and tabletop (partly folded, held tall).
# Its only runtime is iOS 27.1, which the image carries with the `iPhone Duo`
# device type. No command-line tool can fold the Simulator, so
# Scripts/duo-pose/set-duo-pose.sh presses Device Hub's buttons through the
# Accessibility API, which the image's bash is trusted for (probed
# 2026-10-28), and fails the job if the pose didn't take. A plan's tests
# don't run in parallel, so they run on the posed Simulator itself.
#
# Each environment's plan can be split by test class across `shards` parallel
# jobs ("…, part 1 of 2"; Scripts/ui-test-shards.py), as tv-ui-tests.yml
# splits the Apple TV's. The full plan needs it: in one job it ran past the
# 150-minute limit on the iPad and the iPhone Duo with every test passing
# (#480; the iPad's tests alone took about 115 min on iOS 27.0 and 127 on
# 27.2). One small job per environment (`ui-tests-result`,
# `duo-ui-tests-result`) then reports under the environment's own name, which
# the rulesets require; it passes only when every part of that environment
# recorded a pass. A smoke run is one part per environment ("part 1 of 1").
on:
  workflow_call:
    inputs:
      test-plan:
        description: Test plan to run (see TestPlans/).
        required: true
        type: string
      latest-only:
        description: >-
          Run only the latest iOS version (the PR gate), rather than every
          supported one.
        required: false
        type: boolean
        default: false
      duo-poses:
        description: >-
          The iPhone Duo poses to run the plan in, as a JSON array of
          "closed", "open", "book" and "tabletop", one job each. "[]" runs
          none.
        required: false
        type: string
        default: '["closed", "open", "book", "tabletop"]'
      retry-tests-on-failure:
        description: See the build-and-test action's input of the same name.
        required: false
        type: boolean
        default: false
      shards:
        description: >-
          How many parallel jobs to split each environment's plan across, by
          test class. Only for a plan that runs whole classes (UITests-Full);
          a plan that selects single tests (UITests-Smoke) stays at 1, or its
          classes would run whole.
        required: false
        type: number
        default: 1
      timeout-minutes:
        description: >-
          Per-job timeout, for each part of a split plan. Unsplit, the full
          plan took 46 min on iPhone and
          54 min on iPad on 2026-09-26; on 2026-10-22 iPad iOS 27.0 took 62
          min, and a slow runner (a Simulator that lost 16 min before testing
          began) ran the v1.2.0-beta.1 release's leg past 90 with no test
          failed, so 120 left room for one. The iPhone Duo is slowest: after
          the test-quality journeys (#435 to #447) its build and plan took 92
          to 96 min, and three legs ran past their limit in two nightlies
          (2026-11-10 and 11, every test passing), so 150.
        required: false
        type: number
        default: 150

permissions:
  contents: read

jobs:
  plan:
    # Which classes each part runs, and the iOS versions, which the parts and
    # the per-environment results below both read. On Linux: it only reads
    # the sources.
    name: Plan the shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      os: ${{ steps.os.outputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Split the test classes
        id: shards
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          shards=$(python3 Scripts/ui-test-shards.py DionysusPlayerUITests UITestCase "$SHARDS")
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "$shards" | jq -r '.[] | "Part \(.index) of \(.count): \(if .tests == "" then "the whole plan" else .tests end)"'

      - name: List the iOS versions
        # Objects rather than a version list plus `include:` entries for the
        # runner and Xcode: an `include:` entry that matches no combination is
        # added as a job of its own, so with `latest-only` the 18.6 entry
        # would become a stray job with no device. `cached-runtime` marks the
        # leg whose runtime comes from `floor-runtime`.
        id: os
        env:
          LATEST_ONLY: ${{ inputs.latest-only }}
        run: |
          latest='{"version": "27.2", "runner": "xcode-27", "xcode": "27.1", "cached-runtime": false}'
          floor='{"version": "18.6", "runner": "xcode-27", "xcode": "27.1", "cached-runtime": true}'
          if [ "$LATEST_ONLY" = true ]; then os="[$latest]"; else os="[$latest, $floor]"; fi
          echo "os=$(echo "$os" | jq -c .)" >> "$GITHUB_OUTPUT"

  floor-runtime:
    # Puts macos-15's iOS 18.6 Simulator runtime in the Actions cache for the
    # floor jobs (see the top of this file). Only a lookup when it's already
    # there, which after the first run on `develop` it is for every branch:
    # a PR reads its base branch's caches. The image is about 8.5 GB of the
    # repository's 10 GB cache.
    #
    # It never checks out the repository, so nothing a PR changes runs before
    # the save: the cache can hold only what the image itself carries.
    name: iOS 18.6 runtime
    if: ${{ !inputs.latest-only }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      key: ${{ steps.locate.outputs.key }}
    steps:
      - name: Locate the runtime
        id: locate
        shell: bash
        run: |
          # The image a runtime was installed from: a cryptex runtime's
          # downloaded bundle (`parentImagePath`) or a plain disk image
          # (`path`). Either is what `xcodebuild -importPlatform` takes.
          entry=$(xcrun simctl runtime list -j \
            | jq -c '[.[] | select(.version == "18.6" and .platformIdentifier == "com.apple.platform.iphonesimulator")] | first // empty')
          if [ -z "$entry" ]; then
            echo "::error::macos-15 no longer carries an iOS 18.6 runtime; the floor leg needs a new source (see ui-tests.yml)." >&2
            xcrun simctl runtime list
            exit 1
          fi
          echo "$entry" | jq .
          image=$(echo "$entry" | jq -r '.parentImagePath // .path')
          build=$(echo "$entry" | jq -r '.build')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "key=ios-simulator-runtime-18.6-$build" >> "$GITHUB_OUTPUT"

      - name: Look it up in the cache
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ios-runtime
          key: ${{ steps.locate.outputs.key }}
          lookup-only: true

      - name: Copy the runtime image
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.locate.outputs.image }}
        run: |
          mkdir -p ios-runtime
          cp "$IMAGE" ios-runtime/iOS-18.6.dmg
          ls -lh ios-runtime

      - name: Save it to the cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios-runtime
          key: ${{ steps.locate.outputs.key }}

  ui-tests:
    # One part of one environment's plan. The environment's own check, the
    # one the rulesets require, is `ui-tests-result` below.
    name: ${{ matrix.family }}, iOS ${{ matrix.os.version }}, part ${{ matrix.shard.index }} of ${{ matrix.shard.count }}
    needs: [plan, floor-runtime]
    # Runs when the runtime job succeeded, or was skipped (`latest-only`).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.floor-runtime.result != 'failure' }}
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      # Every environment always reports. Without this, one failure cancels
      # the rest and hides whether the break is device- or OS-specific —
      # which, for a layout that forks on size class and a codebase full of
      # `#available(iOS 26, *)`, is the first thing worth knowing.
      fail-fast: false
      matrix:
        # The iOS versions are listed in `plan` (see there).
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        family: [iPhone, iPad]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
        include:
          - family: iPhone
            device: iPhone 16
          - family: iPad
            device: iPad (A16)

    steps:
      - name: Note when the job started
        # For "Work out the test step's time limit".
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        # Always the triggering commit. There is deliberately no `ref` input:
        # a reusable workflow that checks out a caller-chosen ref and then runs
        # that ref's local actions (setup-ios-project, build-and-test) is
        # CodeQL's cache-poisoning pattern (PR #258). release.yml gets the
        # tagged commit by being dispatched on the tag instead.
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project
        with:
          xcode-version: ${{ matrix.os.xcode }}

      - name: Make room for the iOS 18.6 runtime
        # Restoring the 8.5 GB image and importing it (which copies it) need
        # about 17 GB, more than the image leaves free: the first run failed
        # with "Cannot copy the image because the disk is almost full". The
        # image's other Xcodes (27.0, 27.2, the 27.3 beta) are unused here.
        if: matrix.os.cached-runtime
        shell: bash
        run: |
          df -h /
          selected=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            if [ "$(cd "$app" && pwd -P)" != "$selected" ]; then
              echo "Removing $app"
              sudo rm -rf "$app"
            fi
          done
          df -h /

      - name: Restore the iOS 18.6 runtime
        if: matrix.os.cached-runtime
        uses: actions/cache/restore@v4
        with:
          path: ios-runtime
          key: ${{ needs.floor-runtime.outputs.key }}
          fail-on-cache-miss: true

      - name: Install the iOS 18.6 runtime
        if: matrix.os.cached-runtime
        shell: bash
        run: |
          # `-importPlatform` takes a downloaded runtime bundle; a plain disk
          # image goes through `simctl runtime add`. The image is deleted once
          # imported: the runner's disk holds the build too.
          if ! xcodebuild -importPlatform ios-runtime/iOS-18.6.dmg; then
            echo "::notice::-importPlatform refused the image; trying simctl runtime add."
            xcrun simctl runtime add ios-runtime/iOS-18.6.dmg
          fi
          rm -rf ios-runtime
          for _ in $(seq 1 60); do
            if xcrun simctl list runtimes available -j \
              | jq -e '.runtimes[] | select(.platform == "iOS" and .version == "18.6")' >/dev/null; then
              xcrun simctl list runtimes
              exit 0
            fi
            sleep 10
          done
          echo "::error::The iOS 18.6 runtime didn't become available within 10 minutes." >&2
          xcrun simctl runtime list
          exit 1

      - name: Shut down all simulators
        # A simulator left booted by the image (or by a previous step) is the
        # single most common source of UI-test flake on a shared runner:
        # xcodebuild picks a device that is already mid-boot and times out
        # launching the app. Start from a known-clean state instead.
        run: xcrun simctl shutdown all || true

      - name: Work out the test step's time limit
        # The job's own timeout cancels the whole job: no log is kept and the
        # failure-only upload steps never run. Stopping "Build and test" 10
        # minutes before the job's limit fails just that step, so they still
        # run. Counted from the job's start, not from this step's: setup,
        # boot and a Duo pose take 5 to 12 minutes, and a budget of the job's
        # limit less 10 let a Duo job run into its own timeout (nightly,
        # 2026-11-11). (Expressions have no arithmetic.)
        id: budget
        shell: bash
        env:
          JOB_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          used=$(( ($(date +%s) - JOB_STARTED + 59) / 60 ))
          minutes=$(( JOB_MINUTES - 10 - used ))
          [ "$minutes" -ge 1 ] || minutes=1
          echo "Used $used of $JOB_MINUTES min before testing; the test step gets $minutes."
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Build and test
        id: test
        uses: ./.github/actions/build-and-test
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        with:
          test-plan: ${{ inputs.test-plan }}
          device-type: ${{ matrix.device }}
          ios-version: ${{ matrix.os.version }}
          retry-tests-on-failure: ${{ inputs.retry-tests-on-failure }}
          only-testing: ${{ matrix.shard.tests }}
          result-bundle-path: .build/UITestResults.xcresult

      - name: Upload UI test results
        # And when a test passed only on a retry: the job is green, and the
        # bundle is the one place to see what the first attempt met. And
        # when the job was cancelled: xcodebuild's output reaches the job's
        # log only when the step ends, so a cancelled job otherwise leaves
        # nothing to read (#480: two iPad jobs cancelled mid-plan, no cause
        # left behind). `.build/test-attempt-*.log` is written as it goes.
        if: failure() || cancelled() || steps.test.outputs.retried == 'true'
        uses: actions/upload-artifact@v7
        with:
          # A failed UI test's .xcresult carries the screenshots and the
          # recorded interaction, which is the only practical way to see what
          # the runner actually saw.
          # The second bundle exists only if the plan was run again after the
          # test runner crashed (build-and-test's "Test" step).
          name: ui-test-results-${{ inputs.test-plan }}-${{ matrix.family }}-iOS-${{ matrix.os.version }}-part-${{ matrix.shard.index }}
          path: |
            .build/UITestResults.xcresult
            .build/UITestResults-attempt-2.xcresult
            .build/test-attempt-*.log
          retention-days: 7
          if-no-files-found: ignore
          # The glob makes `.build` the search root, and it is hidden: without
          # this every path above is skipped and nothing uploads.
          include-hidden-files: true
          # A re-run of this job uploads again under the same name.
          overwrite: true

      - name: Record this part's result
        # Read by `ui-tests-result`. `needs` can't tell a matrix's jobs apart,
        # so each part leaves its own result behind. A part that never gets
        # here (its runner lost) leaves none, which counts as a failure.
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          PART: ${{ matrix.shard.index }}
        run: |
          mkdir -p part-result
          echo "$STATUS" > "part-result/part-$PART"

      - name: Upload this part's result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-part-result-${{ inputs.test-plan }}-${{ matrix.family }}-iOS-${{ matrix.os.version }}-part-${{ matrix.shard.index }}
          path: part-result
          retention-days: 1
          overwrite: true

  ui-tests-result:
    # ⚠️ This name is part of a required status check. For a reusable
    # workflow GitHub reports each job as "<caller job name> / <this name>" —
    # e.g. "UI smoke tests / iPhone, iOS 27.2" — and the branch rulesets
    # require them by that exact string ("develop protection" the smoke ones,
    # "Secure stable" the "Full UI tests" ones). Renaming it, or changing a
    # device or an OS (in `plan`), means updating both rulesets in the same
    # breath, or every PR waits forever on a check that no longer reports.
    #
    # One result per environment for the parts above. `always()`, not
    # `!cancelled()`: a skipped required check counts as passed.
    name: ${{ matrix.family }}, iOS ${{ matrix.os.version }}
    needs: [plan, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Two placeholders when `plan` failed, so this job still runs and fails.
        os: >-
          ${{ fromJSON(needs.plan.outputs.os || '[{"version": "27.2"}, {"version": "18.6"}]') }}
        family: [iPhone, iPad]
    steps:
      - name: Checkout the result check
        uses: actions/checkout@v7
        with:
          sparse-checkout: Scripts/ci/check-part-results.sh
          sparse-checkout-cone-mode: false

      - name: Download every part's result
        # Finds nothing when no part recorded one; the next step fails then.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: ui-part-result-${{ inputs.test-plan }}-${{ matrix.family }}-iOS-${{ matrix.os.version }}-part-*
          path: part-result
          merge-multiple: true

      - name: Every part passed
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
        run: Scripts/ci/check-part-results.sh part-result "$SHARDS"

  duo-ui-tests:
    # One part of one pose's plan; the pose's own check is
    # `duo-ui-tests-result` below.
    name: iPhone Duo ${{ matrix.pose }}, iOS 27.1, part ${{ matrix.shard.index }} of ${{ matrix.shard.count }}
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.duo-poses != '[]' }}
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      # As `ui-tests`: every pose always reports.
      fail-fast: false
      matrix:
        pose: ${{ fromJSON(inputs.duo-poses) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - name: Note when the job started
        # For "Work out the test step's time limit".
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        # Always the triggering commit; see `ui-tests`.
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Shut down all simulators
        # See `ui-tests`.
        run: xcrun simctl shutdown all || true

      - name: Boot an iPhone Duo
        id: duo
        shell: bash
        run: |
          # The same device build-and-test picks below: the image's own
          # "iPhone Duo" on iOS 27.1, or one made here when it has none.
          # Booted before the build, since the pose is set on a running
          # Simulator.
          runtime=$(xcrun simctl list runtimes available -j \
            | jq -r '.runtimes[] | select(.platform == "iOS" and .version == "27.1") | .identifier' | head -1)
          if [ -z "$runtime" ]; then
            echo "::error::No iOS 27.1 runtime on this runner image, and the iPhone Duo runs no other." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$runtime" '.devices[$rt] // [] | map(select(.name == "iPhone Duo")) | first | .udid // empty')
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create "iPhone Duo" "iPhone Duo" "$runtime")
          fi
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Set the ${{ matrix.pose }} pose
        # Measured at 3 to 12 minutes over 38 runs (2026-11). It once hung
        # until the job's 45-minute limit (PR #427, 2026-11-05); 20 fails a
        # hang early and leaves room for a slow Device Hub launch.
        timeout-minutes: 20
        env:
          UDID: ${{ steps.duo.outputs.udid }}
          POSE: ${{ matrix.pose }}
        run: Scripts/duo-pose/set-duo-pose.sh "$UDID" "$POSE"

      - name: Work out the test step's time limit
        # The job's own timeout cancels the whole job: no log is kept and the
        # failure-only upload steps never run. Stopping "Build and test" 10
        # minutes before the job's limit fails just that step, so they still
        # run. Counted from the job's start, not from this step's: setup,
        # boot and a Duo pose take 5 to 12 minutes, and a budget of the job's
        # limit less 10 let a Duo job run into its own timeout (nightly,
        # 2026-11-11). (Expressions have no arithmetic.)
        id: budget
        shell: bash
        env:
          JOB_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          used=$(( ($(date +%s) - JOB_STARTED + 59) / 60 ))
          minutes=$(( JOB_MINUTES - 10 - used ))
          [ "$minutes" -ge 1 ] || minutes=1
          echo "Used $used of $JOB_MINUTES min before testing; the test step gets $minutes."
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"

      - name: Build and test
        id: test
        uses: ./.github/actions/build-and-test
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.minutes) }}
        env:
          # Reaches the tests as DUO_POSE (`UITestCase.duoPose`): a flat
          # display's fold looks the same to XCUITest as a partly folded one.
          TEST_RUNNER_DUO_POSE: ${{ matrix.pose }}
        with:
          test-plan: ${{ inputs.test-plan }}
          device-type: iPhone Duo
          ios-version: "27.1"
          # So a rerun after a reboot sets the pose again.
          duo-pose: ${{ matrix.pose }}
          retry-tests-on-failure: ${{ inputs.retry-tests-on-failure }}
          only-testing: ${{ matrix.shard.tests }}
          result-bundle-path: .build/UITestResults.xcresult

      - name: Upload UI test results
        # As `ui-tests`: on a failure, a retry or a cancel.
        if: failure() || cancelled() || steps.test.outputs.retried == 'true'
        uses: actions/upload-artifact@v7
        with:
          # See `ui-tests` for the second bundle.
          name: ui-test-results-${{ inputs.test-plan }}-iPhone-Duo-${{ matrix.pose }}-part-${{ matrix.shard.index }}
          path: |
            .build/UITestResults.xcresult
            .build/UITestResults-attempt-2.xcresult
            .build/test-attempt-*.log
          retention-days: 7
          if-no-files-found: ignore
          # The glob makes `.build` the search root, and it is hidden: without
          # this every path above is skipped and nothing uploads.
          include-hidden-files: true
          overwrite: true

      - name: Record this part's result
        # See `ui-tests`.
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
          PART: ${{ matrix.shard.index }}
        run: |
          mkdir -p part-result
          echo "$STATUS" > "part-result/part-$PART"

      - name: Upload this part's result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-part-result-${{ inputs.test-plan }}-iPhone-Duo-${{ matrix.pose }}-part-${{ matrix.shard.index }}
          path: part-result
          retention-days: 1
          overwrite: true

  duo-ui-tests-result:
    # ⚠️ Part of required status checks, as `ui-tests-result`'s name is: "UI
    # smoke tests / iPhone Duo closed, iOS 27.1" and so on. Renaming it, or a
    # pose, means updating both rulesets in the same breath.
    #
    # One result per pose for the parts above; see `ui-tests-result`.
    name: iPhone Duo ${{ matrix.pose }}, iOS 27.1
    needs: [plan, duo-ui-tests]
    if: ${{ always() && inputs.duo-poses != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        pose: ${{ fromJSON(inputs.duo-poses) }}
    steps:
      - name: Checkout the result check
        uses: actions/checkout@v7
        with:
          sparse-checkout: Scripts/ci/check-part-results.sh
          sparse-checkout-cone-mode: false

      - name: Download every part's result
        # Finds nothing when no part recorded one; the next step fails then.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: ui-part-result-${{ inputs.test-plan }}-iPhone-Duo-${{ matrix.pose }}-part-*
          path: part-result
          merge-multiple: true

      - name: Every part passed
        shell: bash
        env:
          SHARDS: ${{ inputs.shards }}
        run: Scripts/ci/check-part-results.sh part-result "$SHARDS"
