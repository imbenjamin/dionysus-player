name: UI tests

# The UI-test device/OS matrix, in one place. Called by pr-checks.yml (smoke
# plan), nightly-ui-tests.yml and release.yml (full plan) — so the nightly run
# exercises exactly what gates a release, and a manual nightly dispatch on a
# branch is a dry run of the release's UI stage.
#
# The matrix is one iPhone and one iPad on:
#   - the latest iOS on the `xcode-27` image (27.0, its only iOS runtime)
#   - the deployment floor, iOS 18.6 (project.yml's target is 18.0). This is
#     the only place the pre-26 branch of every `#available(iOS 26, *)` check
#     runs.
#
# Every leg builds with Xcode 27.1 on `xcode-27`, the Xcode release.yml
# archives with and the one AetherEngine is built and tested with: 7.43.0 and
# later don't compile with Xcode 26 (2026-10-20, "sending 'codecpar' risks
# causing data races"), which is what moved iOS off `macos-26`.
#
# The floor needs an iOS 18.6 runtime, which the image doesn't carry and Xcode
# won't download (`xcodebuild -downloadPlatform iOS -buildVersion 18.6`
# answers "not available for download", exit 70, on Xcode 26.6 and 27.1
# alike). `macos-15` does carry it, so the `floor-runtime` job below copies its
# runtime image into the Actions cache (once: a later run finds it there) and
# the floor jobs install it from the cache before building. Xcode 27.1 runs
# an iOS 18.6 Simulator (checked on a Mac, 2026-10-20). Building on `macos-15`
# instead isn't possible: its newest Xcode, 26.3, can't compile AetherEngine.
#
# When CI moves to a new Xcode, update the list below together with
# setup-ios-project's default and the `runs-on` labels (pr-checks.yml,
# codeql.yml, release.yml).
#
# The device models are the same on every OS, so a failure on only one OS
# can't be a screen-size difference. iPhone 16 rather than 17 because the 17
# can't run iOS 18; iPad (A16) runs both.
#
# The iPhone Duo runs in its own job (`duo-ui-tests`), once per pose in
# `duo-poses`: closed (the outer display), open (the inner one, held wide),
# book (partly folded, held wide) and tabletop (partly folded, held tall).
# Its only runtime is iOS 27.1, which the image carries with the `iPhone Duo`
# device type. No command-line tool can fold the Simulator, so
# Scripts/duo-pose/set-duo-pose.sh presses Device Hub's buttons through the
# Accessibility API, which the image's bash is trusted for (probed
# 2026-10-28), and fails the job if the pose didn't take. A plan's tests
# don't run in parallel, so they run on the posed Simulator itself.
on:
  workflow_call:
    inputs:
      test-plan:
        description: Test plan to run (see TestPlans/).
        required: true
        type: string
      latest-only:
        description: >-
          Run only the latest iOS version (the PR gate), rather than every
          supported one.
        required: false
        type: boolean
        default: false
      duo-poses:
        description: >-
          The iPhone Duo poses to run the plan in, as a JSON array of
          "closed", "open", "book" and "tabletop", one job each. "[]" runs
          none.
        required: false
        type: string
        default: '["closed", "open", "book", "tabletop"]'
      retry-tests-on-failure:
        description: See the build-and-test action's input of the same name.
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: >-
          Per-environment job timeout. The full plan took 46 min on iPhone and
          54 min on iPad on 2026-09-26; on 2026-10-22 iPad iOS 27.0 took 62
          min, and a slow runner (a Simulator that lost 16 min before testing
          began) ran the v1.2.0-beta.1 release's leg past 90 with no test
          failed, so 120 leaves room for one.
        required: false
        type: number
        default: 120

permissions:
  contents: read

jobs:
  floor-runtime:
    # Puts macos-15's iOS 18.6 Simulator runtime in the Actions cache for the
    # floor jobs (see the top of this file). Only a lookup when it's already
    # there, which after the first run on `develop` it is for every branch:
    # a PR reads its base branch's caches. The image is about 8.5 GB of the
    # repository's 10 GB cache.
    #
    # It never checks out the repository, so nothing a PR changes runs before
    # the save: the cache can hold only what the image itself carries.
    name: iOS 18.6 runtime
    if: ${{ !inputs.latest-only }}
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      key: ${{ steps.locate.outputs.key }}
    steps:
      - name: Locate the runtime
        id: locate
        shell: bash
        run: |
          # The image a runtime was installed from: a cryptex runtime's
          # downloaded bundle (`parentImagePath`) or a plain disk image
          # (`path`). Either is what `xcodebuild -importPlatform` takes.
          entry=$(xcrun simctl runtime list -j \
            | jq -c '[.[] | select(.version == "18.6" and .platformIdentifier == "com.apple.platform.iphonesimulator")] | first // empty')
          if [ -z "$entry" ]; then
            echo "::error::macos-15 no longer carries an iOS 18.6 runtime; the floor leg needs a new source (see ui-tests.yml)." >&2
            xcrun simctl runtime list
            exit 1
          fi
          echo "$entry" | jq .
          image=$(echo "$entry" | jq -r '.parentImagePath // .path')
          build=$(echo "$entry" | jq -r '.build')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "key=ios-simulator-runtime-18.6-$build" >> "$GITHUB_OUTPUT"

      - name: Look it up in the cache
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: ios-runtime
          key: ${{ steps.locate.outputs.key }}
          lookup-only: true

      - name: Copy the runtime image
        if: steps.lookup.outputs.cache-hit != 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.locate.outputs.image }}
        run: |
          mkdir -p ios-runtime
          cp "$IMAGE" ios-runtime/iOS-18.6.dmg
          ls -lh ios-runtime

      - name: Save it to the cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios-runtime
          key: ${{ steps.locate.outputs.key }}

  ui-tests:
    # ⚠️ This name is part of a required status check. For a reusable
    # workflow GitHub reports each job as "<caller job name> / <this name>" —
    # e.g. "UI smoke tests / iPhone, iOS 27.0" — and the branch rulesets
    # require them by that exact string ("develop protection" the smoke ones,
    # "Secure stable" the "Full UI tests" ones). Renaming it, or changing a
    # device or an OS below, means updating both rulesets in the same breath,
    # or every PR waits forever on a check that no longer reports.
    name: ${{ matrix.family }}, iOS ${{ matrix.os.version }}
    needs: floor-runtime
    # Runs when the runtime job succeeded, or was skipped (`latest-only`).
    if: ${{ !cancelled() && needs.floor-runtime.result != 'failure' }}
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      # Every environment always reports. Without this, one failure cancels
      # the rest and hides whether the break is device- or OS-specific —
      # which, for a layout that forks on size class and a codebase full of
      # `#available(iOS 26, *)`, is the first thing worth knowing.
      fail-fast: false
      matrix:
        # Objects rather than a version list plus `include:` entries for the
        # runner and Xcode: an `include:` entry that matches no combination is
        # added as a job of its own, so with `latest-only` the 18.6 entry
        # would become a stray job with no device. `cached-runtime` marks the
        # leg whose runtime comes from `floor-runtime`.
        os: >-
          ${{ fromJSON(inputs.latest-only
            && '[{"version": "27.0", "runner": "xcode-27", "xcode": "27.1", "cached-runtime": false}]'
            || '[{"version": "27.0", "runner": "xcode-27", "xcode": "27.1", "cached-runtime": false},
                 {"version": "18.6", "runner": "xcode-27", "xcode": "27.1", "cached-runtime": true}]') }}
        family: [iPhone, iPad]
        include:
          - family: iPhone
            device: iPhone 16
          - family: iPad
            device: iPad (A16)

    steps:
      - name: Checkout
        # Always the triggering commit. There is deliberately no `ref` input:
        # a reusable workflow that checks out a caller-chosen ref and then runs
        # that ref's local actions (setup-ios-project, build-and-test) is
        # CodeQL's cache-poisoning pattern (PR #258). release.yml gets the
        # tagged commit by being dispatched on the tag instead.
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project
        with:
          xcode-version: ${{ matrix.os.xcode }}

      - name: Make room for the iOS 18.6 runtime
        # Restoring the 8.5 GB image and importing it (which copies it) need
        # about 17 GB, more than the image leaves free: the first run failed
        # with "Cannot copy the image because the disk is almost full". The
        # image's other Xcodes (27.0, the 27.2 beta) are unused here.
        if: matrix.os.cached-runtime
        shell: bash
        run: |
          df -h /
          selected=$(cd "$(xcode-select -p)/../.." && pwd -P)
          for app in /Applications/Xcode*.app; do
            [ -L "$app" ] && continue
            if [ "$(cd "$app" && pwd -P)" != "$selected" ]; then
              echo "Removing $app"
              sudo rm -rf "$app"
            fi
          done
          df -h /

      - name: Restore the iOS 18.6 runtime
        if: matrix.os.cached-runtime
        uses: actions/cache/restore@v4
        with:
          path: ios-runtime
          key: ${{ needs.floor-runtime.outputs.key }}
          fail-on-cache-miss: true

      - name: Install the iOS 18.6 runtime
        if: matrix.os.cached-runtime
        shell: bash
        run: |
          # `-importPlatform` takes a downloaded runtime bundle; a plain disk
          # image goes through `simctl runtime add`. The image is deleted once
          # imported: the runner's disk holds the build too.
          if ! xcodebuild -importPlatform ios-runtime/iOS-18.6.dmg; then
            echo "::notice::-importPlatform refused the image; trying simctl runtime add."
            xcrun simctl runtime add ios-runtime/iOS-18.6.dmg
          fi
          rm -rf ios-runtime
          for _ in $(seq 1 60); do
            if xcrun simctl list runtimes available -j \
              | jq -e '.runtimes[] | select(.platform == "iOS" and .version == "18.6")' >/dev/null; then
              xcrun simctl list runtimes
              exit 0
            fi
            sleep 10
          done
          echo "::error::The iOS 18.6 runtime didn't become available within 10 minutes." >&2
          xcrun simctl runtime list
          exit 1

      - name: Shut down all simulators
        # A simulator left booted by the image (or by a previous step) is the
        # single most common source of UI-test flake on a shared runner:
        # xcodebuild picks a device that is already mid-boot and times out
        # launching the app. Start from a known-clean state instead.
        run: xcrun simctl shutdown all || true

      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          test-plan: ${{ inputs.test-plan }}
          device-type: ${{ matrix.device }}
          ios-version: ${{ matrix.os.version }}
          retry-tests-on-failure: ${{ inputs.retry-tests-on-failure }}
          result-bundle-path: .build/UITestResults.xcresult

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # A failed UI test's .xcresult carries the screenshots and the
          # recorded interaction, which is the only practical way to see what
          # the runner actually saw.
          name: ui-test-results-${{ inputs.test-plan }}-${{ matrix.family }}-iOS-${{ matrix.os.version }}
          path: .build/UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  duo-ui-tests:
    # ⚠️ Part of required status checks, as `ui-tests`' name is: "UI smoke
    # tests / iPhone Duo closed, iOS 27.1" and so on. Renaming it, or a pose,
    # means updating both rulesets in the same breath.
    name: iPhone Duo ${{ matrix.pose }}, iOS 27.1
    if: ${{ inputs.duo-poses != '[]' }}
    runs-on: xcode-27
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      # As `ui-tests`: every pose always reports.
      fail-fast: false
      matrix:
        pose: ${{ fromJSON(inputs.duo-poses) }}

    steps:
      - name: Checkout
        # Always the triggering commit; see `ui-tests`.
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Shut down all simulators
        # See `ui-tests`.
        run: xcrun simctl shutdown all || true

      - name: Boot an iPhone Duo
        id: duo
        shell: bash
        run: |
          # The same device build-and-test picks below: the image's own
          # "iPhone Duo" on iOS 27.1, or one made here when it has none.
          # Booted before the build, since the pose is set on a running
          # Simulator.
          runtime=$(xcrun simctl list runtimes available -j \
            | jq -r '.runtimes[] | select(.platform == "iOS" and .version == "27.1") | .identifier' | head -1)
          if [ -z "$runtime" ]; then
            echo "::error::No iOS 27.1 runtime on this runner image, and the iPhone Duo runs no other." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$runtime" '.devices[$rt] // [] | map(select(.name == "iPhone Duo")) | first | .udid // empty')
          if [ -z "$udid" ]; then
            udid=$(xcrun simctl create "iPhone Duo" "iPhone Duo" "$runtime")
          fi
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Set the ${{ matrix.pose }} pose
        env:
          UDID: ${{ steps.duo.outputs.udid }}
          POSE: ${{ matrix.pose }}
        run: Scripts/duo-pose/set-duo-pose.sh "$UDID" "$POSE"

      - name: Build and test
        uses: ./.github/actions/build-and-test
        env:
          # Reaches the tests as DUO_POSE (`UITestCase.duoPose`): a flat
          # display's fold looks the same to XCUITest as a partly folded one.
          TEST_RUNNER_DUO_POSE: ${{ matrix.pose }}
        with:
          test-plan: ${{ inputs.test-plan }}
          device-type: iPhone Duo
          ios-version: "27.1"
          retry-tests-on-failure: ${{ inputs.retry-tests-on-failure }}
          result-bundle-path: .build/UITestResults.xcresult

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ inputs.test-plan }}-iPhone-Duo-${{ matrix.pose }}
          path: .build/UITestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
