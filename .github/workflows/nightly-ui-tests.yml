name: Nightly UI tests

# The full UI suite, on an iPhone and an iPad, on every iOS version the app
# supports — see ui-tests.yml for the matrix and why it's shaped that way.
#
# Separate from pr-checks.yml, which runs only the smoke plan. UI tests are
# slow and a shared macOS runner is variable, so the split trades "every
# regression is caught before merge" for "PR feedback stays under ten
# minutes" — a regression outside the smoke paths surfaces within a day
# instead. If that trade stops paying (a real break repeatedly reaching
# `develop` and being found here), move the full plan into pr-checks.yml
# rather than adding a third tier.
on:
  schedule:
    # 03:00 UTC. Nothing depends on the hour beyond it being outside the
    # working day, when the runner pool is least contended.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled run and a manual one at the same time would just contend for
  # the same runners; the later one wins.
  group: nightly-ui-tests
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Full UI tests
    uses: ./.github/workflows/ui-tests.yml
    with:
      test-plan: UITests-Full
      # A nightly run has the time budget for it, and a test that only fails
      # once is reported as flaky rather than as a break.
      retry-tests-on-failure: true
