name: Nightly UI tests

# The full UI suite, on an iPhone and an iPad, on every iOS version the app
# supports — see ui-tests.yml for the matrix and why it's shaped that way.
#
# Separate from pr-checks.yml, which runs only the smoke plan on PRs into
# `develop` (PRs into `stable` get the full plan too). UI tests are
# slow and a shared macOS runner is variable, so the split trades "every
# regression is caught before merge" for "PR feedback stays under ten
# minutes" — a regression outside the smoke paths surfaces within a day
# instead. If that trade stops paying (a real break repeatedly reaching
# `develop` and being found here), move the full plan into pr-checks.yml
# rather than adding a third tier.
on:
  schedule:
    # 21:00 UTC (since 2026-11-04; was 03:00). GitHub started the 03:00
    # run 5½–7½ hours late all week, into the working day, where it
    # contended with PR checks and a manual branch run cancelled it
    # (`cancel-in-progress`). Nothing else depends on the hour.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled run and a manual one at the same time would just contend for
  # the same runners; the later one wins.
  group: nightly-ui-tests
  cancel-in-progress: true

jobs:
  ui-tests:
    name: Full UI tests
    uses: ./.github/workflows/ui-tests.yml
    with:
      test-plan: UITests-Full
      # A nightly run has the time budget for it, and a test that only fails
      # once is reported as flaky rather than as a break.
      retry-tests-on-failure: true

  tv-ui-tests:
    # The Apple TV app's full suite on tvOS 27.0 (tv-ui-tests.yml), split
    # across four jobs as release.yml runs it.
    name: Full tvOS UI tests
    uses: ./.github/workflows/tv-ui-tests.yml
    with:
      test-plan: TVUITests
      retry-tests-on-failure: true
      shards: 4

  tv-ui-floor:
    # The smoke journeys on tvOS 26.5, the deployment floor's major. They
    # fail in CI on tvOS 26.x for a reason not yet found (tv-ui-tests.yml's
    # header), so this is an allowed failure: it reports, and passing again
    # is the signal to make it a PR check. The smoke plan, not the full
    # one, which would spend its whole timeout failing.
    name: tvOS floor smoke tests
    uses: ./.github/workflows/tv-ui-tests.yml
    with:
      test-plan: TVUITests-Smoke
      tvos-versions: '["26.5"]'
      allow-failure: true
      timeout-minutes: 40

  unit-flake-hunt:
    # Not UI tests, but the nightly is where an hour of runner time is free:
    # each unit suite five times over in random order, which finds the tests
    # that only pass in the order the PR plans happen to run them in, and the
    # ones that fail one run in five. An allowed failure: it reports (the
    # job's summary lists what failed), it never turns the nightly red and no
    # ruleset requires it. The plans are the random-order copies
    # (`UnitTests-Random`, `TVUnitTests-Random`): xcodebuild has no
    # `-test-execution-ordering` flag. TESTING.md, "Where they run in CI".
    name: Unit flake hunt / ${{ matrix.label }}
    runs-on: xcode-27
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iOS
            scheme: DionysusPlayer
            test-plan: UnitTests-Random
            platform: iOS
            device-type: iPhone 16
            os-version: "27.0"
          - label: tvOS
            scheme: DionysusTV
            test-plan: TVUnitTests-Random
            platform: tvOS
            device-type: Apple TV 4K (3rd generation)
            os-version: "27.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Download the tvOS runtime if the image lacks it
        if: matrix.platform == 'tvOS'
        env:
          TVOS_VERSION: ${{ matrix.os-version }}
        run: |
          if xcrun simctl list runtimes available -j \
            | jq -e --arg v "$TVOS_VERSION" '.runtimes[] | select(.platform == "tvOS" and .version == $v)' > /dev/null; then
            echo "tvOS $TVOS_VERSION is on the image"
          else
            xcodebuild -downloadPlatform tvOS -buildVersion "$TVOS_VERSION"
          fi

      - name: Shut down all simulators
        # See ui-tests.yml: a simulator left mid-boot is the commonest
        # source of test flake on a shared runner.
        run: xcrun simctl shutdown all || true

      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          scheme: ${{ matrix.scheme }}
          test-plan: ${{ matrix.test-plan }}
          platform: ${{ matrix.platform }}
          device-type: ${{ matrix.device-type }}
          ios-version: ${{ matrix.os-version }}
          # Run the plan again until a test fails, five times at most: the
          # opposite of a retry, which would hide the flake being hunted.
          # (xcodebuild refuses the two together.)
          run-tests-until-failure: "true"
          test-iterations: "5"
          result-bundle-path: .build/UnitFlakeHunt.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-flake-hunt-${{ matrix.label }}
          path: |
            .build/UnitFlakeHunt.xcresult
            .build/UnitFlakeHunt-attempt-2.xcresult
            .build/test-attempt-*.log
          retention-days: 7
          if-no-files-found: ignore
