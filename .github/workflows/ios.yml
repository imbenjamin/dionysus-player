name: iOS workflow

on:
  # No `push:` trigger: both `main` and `develop` are covered by rulesets
  # that (a) block any push that isn't a PR merge and (b) set
  # `strict_required_status_checks_policy: true` on this workflow's check
  # — together that guarantees every merge commit's tree is identical to
  # what `pull_request` already tested, so a push-triggered re-run would
  # always be re-testing identical code. If either of those ruleset
  # settings ever changes (bypass actors added, strict policy turned off),
  # this reasoning no longer holds and a `push:` trigger would earn its
  # keep again.
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        # No .xcodeproj is committed (see .gitignore) — it's generated from
        # project.yml. Without this step there is nothing for the steps
        # below to find and build.
        run: xcodegen generate
      - name: Verify AetherEngine version display is up to date
        # Runs here (every PR/push to develop/main), not just in
        # release.yml at tag time — a fresh `AetherEngine` resolution
        # picking up a newer release can happen on any PR, and catching it
        # here surfaces it within days of it happening upstream instead of
        # only whenever someone next happens to cut a release. Also has the
        # side effect of populating this runner's SPM caches with today's
        # real resolution, which the Build step below then reuses rather
        # than resolving cold itself. Confirmed live (2026-08-28): a stale
        # *local* SPM cache let a real version bump go undetected on a
        # developer machine even after this same script ran there — CI is
        # always a clean checkout, so this check is meaningful every time
        # it runs here, unlike a local run someone forgets is stale.
        run: |
          ./Scripts/update-aetherengine-version.sh
          if ! git diff --exit-code -- DionysusPlayer/Core/Playback/AetherEngineVersion.swift; then
            echo "::error::AetherEngineVersion.swift is out of date — run ./Scripts/update-aetherengine-version.sh locally and commit the result." >&2
            exit 1
          fi
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Select Simulator
        id: select_simulator
        run: |
          # `xcrun xctrace list devices` (the usual boilerplate here) lists
          # a bare device name with no guarantee it's paired with the
          # runner's "latest" iOS runtime — `-destination
          # platform=...,name=X` with no OS resolves to "OS:latest", which
          # then fails to match if X isn't provisioned for that runtime
          # (confirmed failure: 2026-08-13, picked "iPhone 16e", which only
          # had an older runtime installed on the runner). Selecting a UDID
          # directly from `simctl`'s own available-devices listing instead
          # guarantees a name+runtime pairing that actually exists.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | .key as $rt | .value[] | select(.name | test("^iPhone")) | {runtime: $rt, udid: .udid, name: .name}] | sort_by(.runtime) | last')
          echo "$UDID" | jq .
          udid=$(echo "$UDID" | jq -r '.udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "error: no available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          scheme: ${{ 'default' }}
          udid: ${{ steps.select_simulator.outputs.udid }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,id=$udid"
      - name: Test
        env:
          scheme: ${{ 'default' }}
          udid: ${{ steps.select_simulator.outputs.udid }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,id=$udid"
