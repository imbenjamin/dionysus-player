name: Release

# Fires on any version tag (see VERSIONING.md for the convention:
# `v1.2.3`, `v1.2.3-alpha.4`, `v2.0.0-beta.1`). Builds and tests the exact
# tagged commit, then publishes a GitHub Release for it — marked
# "prerelease" for -alpha/-beta tags, a full release otherwise. No code
# signing/archive export/TestFlight upload yet; that needs App Store
# Connect API key secrets and is a deliberately separate follow-up.
on:
  push:
    tags:
      - "v*.*.*"

# This repo's default GITHUB_TOKEN permissions are read-only (repo Settings
# > Actions > General), so `gh release create` 403s without this — scoped
# to just this workflow rather than flipping the repo-wide default, since
# ios.yml doesn't need write access.
permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, test, and publish a GitHub Release for the tag
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: Scripts/update-version.sh derives the
          # version from `git describe`/`git rev-list --count`, both of
          # which need real history, not the default single-commit
          # shallow clone.
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Stamp version from the tag being built
        run: ./Scripts/update-version.sh

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Select Simulator
        id: select_simulator
        run: |
          # `xcrun xctrace list devices` (the usual boilerplate here) lists
          # a bare device name with no guarantee it's paired with the
          # runner's "latest" iOS runtime — `-destination
          # platform=...,name=X` with no OS resolves to "OS:latest", which
          # then fails to match if X isn't provisioned for that runtime
          # (confirmed failure: 2026-08-13, picked "iPhone 16e", which only
          # had an older runtime installed on the runner). Selecting a UDID
          # directly from `simctl`'s own available-devices listing instead
          # guarantees a name+runtime pairing that actually exists.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | .key as $rt | .value[] | select(.name | test("^iPhone")) | {runtime: $rt, udid: .udid, name: .name}] | sort_by(.runtime) | last')
          echo "$UDID" | jq .
          udid=$(echo "$UDID" | jq -r '.udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "error: no available iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          scheme: ${{ 'default' }}
          udid: ${{ steps.select_simulator.outputs.udid }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,id=$udid"
      - name: Test
        env:
          scheme: ${{ 'default' }}
          udid: ${{ steps.select_simulator.outputs.udid }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=iOS Simulator,id=$udid"

      - name: Regenerate AetherEngine version display
        # Package.resolved only exists once something has actually resolved
        # packages — the Build step above is the first thing in this job
        # that does that, so this has to run after it, not alongside the
        # version stamp earlier.
        run: ./Scripts/update-aetherengine-version.sh

      - name: Verify nothing was left uncommitted for this release
        # By this point in the release flow (see VERSIONING.md), the
        # commit this tag points at should already carry correct generated
        # files — stamped on a release-prep branch and merged *before* the
        # tag was cut, not fixed up after. A non-empty diff here means
        # either that prep step was skipped, or a fresh package resolution
        # picked up a newer AetherEngine release in the gap between prep
        # and tagging. Failing loudly here catches that immediately,
        # instead of shipping a stale "stats for nerds" version display and
        # relying on someone noticing days later.
        run: |
          fail=0
          if ! git diff --exit-code -- \
            Config/Version.xcconfig \
            DionysusPlayer/Core/Playback/AetherEngineVersion.swift
          then
            fail=1
          fi
          # AppVersion.swift's `commit` constant is excused from this
          # comparison: a commit can't contain its own hash, only its
          # parent's, so Scripts/update-version.sh's explicit-tag mode
          # (used to stamp this on the release-prep branch) necessarily
          # recorded the prep commit's parent SHA, one behind this tag's
          # actual commit — expected, not drift. Everything else in the
          # file (the version string, the build number) must still match
          # exactly.
          if ! diff \
            <(git show "HEAD:DionysusPlayer/Shared/AppVersion.swift" | grep -v 'static let commit') \
            <(grep -v 'static let commit' DionysusPlayer/Shared/AppVersion.swift)
          then
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::Generated version files don't match what's checked in for this tag. Run the release-prep flow in VERSIONING.md (stamp on a branch, PR it, merge, *then* tag) before re-cutting this release." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-alpha*|*-beta*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "$TAG" --generate-notes $PRERELEASE_FLAG
