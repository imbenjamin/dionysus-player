name: Release

# Fires on any version tag (see VERSIONING.md for the convention:
# `v1.2.3`, `v1.2.3-alpha.4`, `v2.0.0-beta.1`). Builds and tests the exact
# tagged commit for both apps, then publishes a GitHub Release for it —
# marked "prerelease" for -alpha/-beta tags, a full release otherwise.
#
# The tag is the only input. Nothing needs stamping, predicting, or
# verifying beforehand: this workflow derives the version from the tag it was
# triggered by, at a point where that tag demonstrably exists. See
# VERSIONING.md for why the old "stamp on a release-prep branch, PR it, merge,
# then tag" flow is gone.
#
# Both platforms ship from the one tag: `prepare` resolves it and composes
# the notes, `ios-release` and `tvos-release` each test, archive, sign and
# upload their app to App Store Connect (which is what puts it in
# TestFlight) in parallel, and `publish` creates the GitHub Release only once
# both have. An upload that went through can't be undone, so when one
# platform fails, fix the cause and re-run just that job
# (`gh run rerun <run id> --job <job id>`); the build number comes from the
# tag, and App Store Connect counts it per platform, so the other platform's
# upload doesn't collide with it.
#
# Signing needs five repo secrets/variables — see "Signing setup" in
# VERSIONING.md. When they're absent the signing steps are skipped with a
# loud warning rather than failing the run, so a GitHub Release is still
# published; check the run summary if a tag didn't reach TestFlight.
on:
  push:
    tags:
      - "v*.*.*"
  # Re-run a release for a tag that already exists, without re-tagging —
  # for recovering from an infrastructure failure partway through. Dispatch
  # it *on the tag*, not on a branch:
  #
  #   gh workflow run release.yml --ref v1.2.3-beta.1
  #
  # This used to take the tag as a text input and run from a branch. That
  # meant ui-tests.yml had to accept a ref to check out, which CodeQL rightly
  # flags as cache poisoning: a reusable workflow that checks out a
  # caller-chosen ref and then runs that ref's own local actions. Dispatching
  # on the tag makes the triggering commit the tagged one, so nothing needs
  # choosing. The catch is that the run uses release.yml *as of that tag*, so
  # a fix to this file itself needs a new tag rather than a re-run.
  workflow_dispatch:

# This repo's default GITHUB_TOKEN permissions are read-only (repo Settings
# > Actions > General), so `gh release create` 403s without this — scoped
# to just this workflow rather than flipping the repo-wide default, since
# pr-checks.yml doesn't need write access.
permissions:
  contents: write

concurrency:
  # Never cancel a release mid-flight — unlike a PR run, there's no
  # superseding commit coming, and a half-finished release is worse than a
  # slow one.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ui-tests:
    # The full UI suite on every environment the nightly run covers — one
    # iPhone and one iPad on each supported iOS version (see ui-tests.yml).
    # Its own stage, not steps in `ios-release`: the environments run in
    # parallel on separate runners, and the iOS app isn't signed or uploaded,
    # and nothing is published, unless every one of them passes.
    #
    # That makes a release take longer end to end (roughly the slowest UI
    # environment, then the unit tests and archive), which is the right trade
    # for the last gate before TestFlight. A misplaced tag is caught by
    # `prepare` in parallel with it, before anything is signed.
    #
    # It tests the triggering commit — the tag's, on both a tag push and a
    # dispatch on the tag (see `workflow_dispatch` above for why it must be
    # dispatched that way).
    name: UI tests
    uses: ./.github/workflows/ui-tests.yml
    with:
      test-plan: UITests-Full

  tv-ui-tests:
    # The Apple TV app's smoke plan on tvOS 27.0 (see tv-ui-tests.yml for
    # why only 27.0), with retries. Gates tvos-release as ui-tests gates
    # ios-release.
    #
    # Not the full plan, unlike iOS: in CI it isn't reliable enough to gate
    # a tag, which can't pick up a fix by re-running. Without retries it lost
    # 7 of 197 journeys to a slow accessibility tree (v1.2.0-alpha.2); with
    # them it ran into tv-ui-tests.yml's 90-minute limit (alpha.3), and the
    # nightly's runs of it take 60–88 minutes and fail about two in five.
    # The full plan still gates the promotion PR into stable (a required
    # check) and runs nightly.
    name: tvOS UI tests
    uses: ./.github/workflows/tv-ui-tests.yml
    with:
      test-plan: TVUITests-Smoke
      retry-tests-on-failure: true

  prepare:
    # What both platforms ship and what the release says, decided once.
    # On Linux: it needs only git, gh and openssl, and v1.2.0-alpha.3's run
    # was cancelled when no macOS runner picked this job up within an hour.
    name: Resolve the tag and compose release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      summary: ${{ steps.notes.outputs.summary }}

    steps:
      - name: Resolve tag
        id: tag
        # One place that decides what's being released. Both triggers run on
        # the tag itself, so the ref name *is* the tag — and a dispatch on a
        # branch by mistake fails the format check below with a pointer to
        # the right command.
        #
        # Via env, not `${{ }}` interpolation: a ref name is chosen by whoever
        # pushed it and would otherwise be pasted into the script text
        # verbatim.
        env:
          RAW_TAG: ${{ github.ref_name }}
        run: |
          # Format only — this step runs before checkout, so there's no repo
          # to check existence against yet. A tag that doesn't exist fails at
          # the Checkout step below, which is a clear enough error.
          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag. Expected vX.Y.Z, vX.Y.Z-alpha.N, or vX.Y.Z-beta.N — see VERSIONING.md. To re-run a release, dispatch this workflow on the tag itself: gh workflow run release.yml --ref <tag>" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Prerelease if the tag carries an -alpha/-beta suffix *or* the core
          # version is still 0.x — a 0.x release is by definition not stable,
          # and a suffix-only test would publish a bare `v0.9.0` as a full
          # release. Prereleases are cut from develop, finals from stable.
          CORE="${TAG#v}"; CORE="${CORE%%-*}"; MAJOR="${CORE%%.*}"
          case "$TAG" in
            *-alpha*|*-beta*) PRE=true ;;
            *) if [ "$MAJOR" = "0" ]; then PRE=true; else PRE=false; fi ;;
          esac
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          if [ "$PRE" = "true" ]; then
            echo "branch=develop" >> "$GITHUB_OUTPUT"
          else
            echo "branch=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # Full history + tags: Scripts/update-version.sh derives the
          # version from `git describe`/`git rev-list --count`, both of
          # which need real history, not the default single-commit
          # shallow clone.
          fetch-depth: 0

      - name: Verify the tag is on the right branch
        # Prereleases are cut from develop and stay there; final releases are
        # cut from stable after a develop -> stable promotion (see
        # promote-to-stable.yml). Catching a misplaced tag here costs seconds;
        # catching it after a ~40 minute archive-and-upload costs a build
        # number and a wasted TestFlight slot.
        env:
          BRANCH: ${{ steps.tag.outputs.branch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git merge-base --is-ancestor "$TAG^{commit}" "origin/$BRANCH"; then
            echo "::error::$TAG is not contained in origin/$BRANCH. Prerelease tags (-alpha/-beta, or any 0.x) are cut from develop; final releases are cut from stable after merging the promote-to-stable PR. See VERSIONING.md." >&2
            exit 1
          fi
          echo "$TAG is contained in origin/$BRANCH."

      - name: Compose release notes
        id: notes
        # Composed up front rather than at publish time because three later
        # jobs consume it: both TestFlight uploads' "What to Test" and the
        # GitHub Release body. One tag message, every destination.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The annotated tag's own message is the human-facing summary.
          # `--generate-notes` alone is just an auto-generated "What's Changed"
          # PR list — accurate, but not what a tester wants to read first,
          # which is why this used to be hand-edited after every release.
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$(printf '%s' "$TAG_MSG" | tr -d '[:space:]')" ]; then
            echo "::warning::$TAG has no annotated message, so this release has no human-written summary. Tag with 'git tag -a' and a real message — see VERSIONING.md."
          fi

          GENERATED=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          printf '%s\n\n%s\n' "$TAG_MSG" "$GENERATED" > "$RUNNER_TEMP/notes.md"

          # Multi-line step output needs the delimiter form. The delimiter is
          # random so a tag message that happens to contain it can't terminate
          # the block early (a real injection vector for attacker-controlled
          # text, and merely a footgun for our own).
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "summary<<$DELIM"
            printf '%s\n' "$TAG_MSG"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Keep the notes for publish
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 7

  ios-release:
    name: iOS build, test, archive and upload
    needs: [ui-tests, prepare]
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # Full history + tags, for Scripts/update-version.sh (see
          # prepare's Checkout).
          fetch-depth: 0

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Stamp version from the tag being built
        # No argument: the tag already exists (it's what triggered this run),
        # so `git describe` resolves it and `git rev-list --count HEAD` is the
        # real commit count. Nothing is predicted, so nothing can be predicted
        # wrong — which is the entire reason the release-prep branch went away.
        run: ./Scripts/update-version.sh

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      # ---------------------------------------------------------------
      # Sign, archive, export, and ship to App Store Connect.
      # ---------------------------------------------------------------

      - name: Check for signing credentials
        id: signing
        # Skip-with-warning rather than fail: a missing secret shouldn't stop
        # the GitHub Release from being published, and this workflow has to be
        # mergeable before the App Store Connect setup is done. The warning and
        # the run summary are what make a skipped upload visible — a tag that
        # quietly never reached TestFlight would be worse than a red run.
        # Everything reaches the shell via env rather than `${{ }}`
        # interpolation: a value containing a quote would otherwise be pasted
        # straight into the script text and break it (or worse).
        env:
          P12: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$KEY" ] \
             && [ -n "$ISSUER_ID" ] \
             && [ -n "$KEY_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App Store Connect credentials are not configured — skipping archive and TestFlight upload. This release will publish to GitHub only. See 'Signing setup' in VERSIONING.md."
            echo "⚠️ **No TestFlight build.** App Store Connect credentials are not configured; this release published to GitHub only. See \`Signing setup\` in VERSIONING.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download provisioning profile
        if: steps.signing.outputs.available == 'true'
        # Installs "Dionysus App Store" (IOS_APP_STORE, tied to the
        # distribution certificate above) into ~/Library/MobileDevice/
        # Provisioning Profiles/, where -exportArchive looks for the profile
        # Config/ExportOptions.plist names. Without this the export fails with
        # "Cloud signing permission error" — see that file's comment.
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.imbenjamin.dionysusplayer
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive and export
        if: steps.signing.outputs.available == 'true'
        id: export
        # Plain xcodebuild rather than apple-actions/xcodebuild: that action
        # pushes `extra-arguments` onto the archive invocation only — its
        # export builds an argument list from scratch (checked against
        # src/main.ts, 2026-08-30) — so the archive's signing flags could
        # never reach an export that needed them.
        #
        # Both invocations sign manually, against the distribution
        # certificate and the profile installed above, and neither talks to
        # Apple. The archive's settings live on the app target's Release
        # config in project.yml (see its comment for why not here).
        #
        # Automatic signing was tried for each half and dropped:
        #   export  — fails with "Cloud signing permission error" even with an
        #     Admin-level key, because it asks Apple to mint a profile
        #     (2026-08-30; see Config/ExportOptions.plist).
        #   archive — worked, but a fresh runner has no development identity,
        #     so every run created a new Apple Development certificate until
        #     the account hit its cap and v1.1.0-alpha.6's archive failed
        #     (2026-09-23). Don't add -allowProvisioningUpdates back: nothing
        #     here should be able to create a certificate.
        #
        # Verified by a local archive + export on 2026-09-24 with no API key
        # at all: signed "Apple Distribution", profile "Dionysus App Store",
        # and the account's certificate count unchanged.
        run: |
          xcodebuild archive \
            -project DionysusPlayer.xcodeproj \
            -scheme DionysusPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath .build/Dionysus.xcarchive \
            | xcbeautify --renderer github-actions

          xcodebuild -exportArchive \
            -archivePath .build/Dionysus.xcarchive \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath .build/export \
            | xcbeautify --renderer github-actions

          IPA=$(find .build/export -name '*.ipa' -maxdepth 1 | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::Export produced no .ipa in .build/export." >&2
            ls -laR .build/export || true
            exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "Exported $IPA"

      - name: Upload to App Store Connect
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5
        with:
          app-path: ${{ steps.export.outputs.ipa }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # The annotated tag's message doubles as TestFlight's "What to Test"
          # — the same text this run publishes as the GitHub Release notes.
          release-notes: ${{ needs.prepare.outputs.summary }}

      - name: Upload build artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.tag }}-build
          # The .ipa is App Store-signed and so installable by nobody; it's
          # kept for forensics, not distribution. dSYMs are what let a
          # TestFlight crash report be symbolicated locally.
          path: |
            .build/export/*.ipa
            .build/Dionysus.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn

  tvos-release:
    name: tvOS build, test, archive and upload
    needs: [tv-ui-tests, prepare]
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # Full history + tags, for Scripts/update-version.sh (see
          # prepare's Checkout).
          fetch-depth: 0

      - name: Set up iOS project
        uses: ./.github/actions/setup-ios-project

      - name: Stamp version from the tag being built
        # As ios-release's step: the tag exists, so nothing is predicted.
        run: ./Scripts/update-version.sh

      - name: List tvOS runtimes
        run: xcrun simctl list runtimes | grep -i tvos || (echo "::error::No tvOS runtime on this image" && exit 1)

      - name: Build and test (tvOS)
        # The same command as pr-checks.yml's "tvOS build and unit tests".
        run: |
          set -o pipefail
          xcodebuild test -project DionysusPlayer.xcodeproj -scheme DionysusTV \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' \
            -resultBundlePath .build/TVTestResults.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tvos-test-results
          path: .build/TVTestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for signing credentials
        id: signing
        # As ios-release's step. Skip-with-warning rather than fail: a missing secret shouldn't stop
        # the GitHub Release from being published, and this workflow has to be
        # mergeable before the App Store Connect setup is done. The warning and
        # the run summary are what make a skipped upload visible — a tag that
        # quietly never reached TestFlight would be worse than a red run.
        # Everything reaches the shell via env rather than `${{ }}`
        # interpolation: a value containing a quote would otherwise be pasted
        # straight into the script text and break it (or worse).
        env:
          P12: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$KEY" ] \
             && [ -n "$ISSUER_ID" ] \
             && [ -n "$KEY_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::App Store Connect credentials are not configured — skipping archive and TestFlight upload. This tvOS build won't reach TestFlight. See 'Signing setup' in VERSIONING.md."
            echo "⚠️ **No tvOS TestFlight build.** App Store Connect credentials are not configured; the Apple TV app wasn't uploaded. See \`Signing setup\` in VERSIONING.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download the app's provisioning profile
        if: steps.signing.outputs.available == 'true'
        # "Dionysus tvOS App Store": the same App ID as iOS, so the type is
        # what tells the two profiles apart.
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.imbenjamin.dionysusplayer
          profile-type: TVOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download the Top Shelf extension's provisioning profile
        if: steps.signing.outputs.available == 'true'
        # "Dionysus Top Shelf App Store".
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.imbenjamin.dionysusplayer.topshelf
          profile-type: TVOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive and export
        if: steps.signing.outputs.available == 'true'
        id: export
        # Signed manually, as ios-release's archive is (see its comment):
        # each profile is named on its target's Release config in
        # project.yml and in Config/ExportOptions-tvOS.plist.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DionysusPlayer.xcodeproj \
            -scheme DionysusTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath .build/DionysusTV.xcarchive \
            | xcbeautify --renderer github-actions

          xcodebuild -exportArchive \
            -archivePath .build/DionysusTV.xcarchive \
            -exportOptionsPlist Config/ExportOptions-tvOS.plist \
            -exportPath .build/tv-export \
            | xcbeautify --renderer github-actions

          IPA=$(find .build/tv-export -name '*.ipa' -maxdepth 1 | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::Export produced no .ipa in .build/tv-export." >&2
            ls -laR .build/tv-export || true
            exit 1
          fi
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "Exported $IPA"

      - name: Upload to App Store Connect
        if: steps.signing.outputs.available == 'true'
        uses: apple-actions/upload-testflight-build@1ad58030672057aa084b4e96beb6f7a8c627f9e6 # v5
        with:
          app-path: ${{ steps.export.outputs.ipa }}
          app-type: appletvos
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ needs.prepare.outputs.summary }}

      - name: Upload build artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.tag }}-tvos-build
          path: |
            .build/tv-export/*.ipa
            .build/DionysusTV.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn

  publish:
    # Only once both apps are uploaded (or skipped for want of credentials),
    # so a published release always means both platforms shipped the tag.
    name: Publish the GitHub Release
    needs: [prepare, ios-release, tvos-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch the release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        # No checkout in this job, so gh is told the repository.
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # create-or-update, so re-running a release that failed after this
          # point (or a workflow_dispatch re-run on the tag) isn't blocked by the release
          # already existing.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE_FLAG \
            || gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE_FLAG
