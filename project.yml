name: DionysusPlayer
options:
  bundleIdPrefix: com.imbenjamin.dionysusplayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # Source language for `DionysusPlayer/Resources/Localizable.xcstrings`
  # (the app's one String Catalog — see that file's own top-of-file note).
  # Only English is populated for now; this is the project-level setting a
  # translation vendor's added languages would show up alongside once the
  # catalog itself grows more `localizations` entries.
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: true
    # Two of Xcode's "Update to recommended settings" suggestions — applying
    # that dialog directly would edit the generated (gitignored) .xcodeproj,
    # which XcodeGen would silently wipe on the next `xcodegen generate`, so
    # these live here instead.
    #
    # `ENABLE_USER_SCRIPT_SANDBOXING`'s own doc comment used to claim this
    # was confirmed safe against the `postCompileScripts` entry below; that
    # claim didn't hold up under re-verification (2026-08-12) — see
    # `Scripts/update-aetherengine-version.sh`'s doc comment for why
    # AetherEngine's version now comes from a checked-in generated Swift
    # constant instead of a build-time Info.plist injection, sidestepping
    # this entirely. GitBranch/GitCommitHash below are a separate,
    # pre-existing, still-unresolved case of the same underlying problem —
    # flagged, not fixed, here; see that script phase's own comment.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  # `from:` is XcodeGen/SPM's "up to next major" rule — any 6.x.x satisfies
  # this (6.5.5 was simply whatever was latest when this was first pinned),
  # so a fresh package resolution (no prior `Package.resolved`/DerivedData
  # SPM cache to reuse — see `.gitignore`'s blanket `*.xcodeproj` rule,
  # which is why that resolved file is never committed) always picks up the
  # newest available 6.x release automatically. It only stops doing that at
  # a 7.0.0 major bump, which needs a deliberate `from:` bump here (a major
  # version is exactly where AetherEngine's public API is allowed to break,
  # per semver, so that's the one case that *shouldn't* happen silently).
  # An already-resolved local checkout won't re-resolve on its own, though
  # — Xcode/`xcodebuild` reuse whatever's already pinned once resolved, by
  # design (reproducible builds mid-session); periodically force a refresh
  # locally with Xcode's File > Packages > Update to Latest Package
  # Versions (or delete DerivedData's SPM state), then run
  # `Scripts/update-aetherengine-version.sh` to refresh the checked-in
  # constant `PlaybackStatsOverlay`'s "AetherEngine Version" row reads —
  # see that script's own comment for why it's a generated file rather
  # than something read back at build time.
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 6.5.5

targets:
  DionysusPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DionysusPlayer
      - path: dionysus.icon
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbenjamin.dionysusplayer.ios
        PRODUCT_NAME: Dionysus
        # Xcode's default for a Swift target already, but set explicitly
        # since it's what actually makes `Text("...")`/`Button("...")`/
        # `String(localized: "...")` literals get extracted into
        # `Localizable.xcstrings` on every build, not just when opened in
        # the Xcode IDE — worth pinning down rather than relying on an
        # implicit default for something this load-bearing.
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: dionysus
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Stamps the current git branch/commit into the *built* Info.plist (not
    # the checked-in template at Generated/Info.plist) so AppVersionInfo can
    # show what was actually built, e.g. on the Profile screen's footer.
    # Position matters and was verified empirically, not assumed: a
    # prebuildScript (before Compile Sources) gets silently clobbered —
    # Xcode's own Info.plist processing runs after it and overwrites the
    # file. postCompileScripts (right after Compile Sources) runs after that
    # processing but still well before code signing, confirmed both by the
    # injected keys surviving into the built .app *and* `codesign --verify`
    # still passing on it.
    #
    # UPDATE (2026-08-12): re-verification found that claim no longer holds
    # — under the current Xcode/build-system combination, this script phase
    # (having no declared outputs) gets scheduled in an early "always run
    # first" group, actually running *before* `ProcessInfoPlistFile`
    # produces the file this writes into, so `GitBranch`/`GitCommitHash`
    # currently get silently overwritten and never make it into a real
    # build despite `xcodebuild` reporting success. Chasing a fix (declaring
    # the built Info.plist as an output collides with
    # `ProcessInfoPlistFile`'s own declared production of it — "Multiple
    # commands produce..."; declaring it only as an input still leaves the
    # script in that early group, and forcing a real ordering edge that way
    # creates a dependency cycle back through `CompileStoryboard`) is a
    # separate task from what prompted this note — left broken-but-flagged
    # rather than silently "fixed" with an unverified guess. AetherEngine's
    # version does *not* depend on this: see
    # `Scripts/update-aetherengine-version.sh` for how that's kept current
    # instead.
    postCompileScripts:
      - name: "Inject Git Branch/Commit into Info.plist"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          BRANCH=$(git -C "${SRCROOT}" rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          COMMIT=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Delete :GitBranch" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :GitBranch string ${BRANCH}" "$PLIST"
            /usr/libexec/PlistBuddy -c "Delete :GitCommitHash" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :GitCommitHash string ${COMMIT}" "$PLIST"
          else
            echo "warning: Info.plist not found at $PLIST yet; git info not injected"
          fi
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Dionysus
        # Xcode target editor's General tab "App Category" dropdown — this
        # is the Info.plist key it actually writes. A media player belongs
        # under Entertainment, not Xcode's default (unset, which App Store
        # Connect would otherwise prompt for at submission time).
        LSApplicationCategoryType: public.app-category.entertainment
        # Static approximation of SplashView (App/SplashView.swift) for the
        # brief window before any app code runs — a system snapshot, not a
        # live view, so it can only offer a flat background colour + one
        # centered image; no gradient, glass, or motion. Once SplashView
        # mounts it takes over seamlessly with the full effect.
        #
        # A storyboard (Resources/LaunchScreen.storyboard), not the
        # plist-only UILaunchScreen dict — the dict's UIImageName rendered
        # the glyph inside a small fixed-size container regardless of the
        # source asset's own declared point size (confirmed empirically: a
        # 6x larger asset had zero visible effect, even after a full
        # Simulator reboot ruled out caching). An explicit Auto Layout
        # width/height constraint in the storyboard is the one lever that
        # actually controls the displayed size.
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Dionysus looks for and connects to your Jellyfin media server on your local network."
        NSBonjourServices:
          - _jellyfin._tcp

  DionysusPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DionysusPlayerTests
    dependencies:
      - target: DionysusPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.imbenjamin.dionysusplayer.ios.tests
        # DionysusPlayer's PRODUCT_NAME is "Dionysus" (not the target name),
        # so XcodeGen's auto-inferred host-application path is wrong —
        # override it explicitly to match.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dionysus.app/Dionysus"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DionysusPlayer:
    build:
      targets:
        DionysusPlayer: all
        DionysusPlayerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DionysusPlayerTests
    archive:
      config: Release
