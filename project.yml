name: DionysusPlayer
options:
  bundleIdPrefix: com.imbenjamin.dionysusplayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: true

packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 6.5.5

targets:
  DionysusPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DionysusPlayer
      - path: dionysus.icon
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.imbenjamin.dionysusplayer.ios
        PRODUCT_NAME: Dionysus
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: dionysus
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Dionysus
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Dionysus looks for and connects to your Jellyfin media server on your local network."
        NSBonjourServices:
          - _jellyfin._tcp

  DionysusPlayerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DionysusPlayerTests
    dependencies:
      - target: DionysusPlayer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.imbenjamin.dionysusplayer.ios.tests
        # DionysusPlayer's PRODUCT_NAME is "Dionysus" (not the target name),
        # so XcodeGen's auto-inferred host-application path is wrong —
        # override it explicitly to match.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dionysus.app/Dionysus"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DionysusPlayer:
    build:
      targets:
        DionysusPlayer: all
        DionysusPlayerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DionysusPlayerTests
    archive:
      config: Release
