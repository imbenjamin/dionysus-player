name: DionysusPlayer
options:
  bundleIdPrefix: com.dionysusplayer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: true

packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    from: 6.5.5

targets:
  DionysusPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DionysusPlayer
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dionysusplayer.ios
        PRODUCT_NAME: Dionysus Player
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Dionysus Player
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Dionysus Player looks for and connects to your Jellyfin media server on your local network."
        NSBonjourServices:
          - _jellyfin._tcp

schemes:
  DionysusPlayer:
    build:
      targets:
        DionysusPlayer: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
